<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- iOS Safari kurulum seridi. Davet linkine tiklayan ve uygulamasi OLMAYAN
     kisi buraya duser: sayfadaki her dugmeden yuksek donusen yer burasi.
     Uygulama zaten kuruluysa Safari serit yerine "Ac" gosterir. -->
<meta name="apple-itunes-app" content="app-id=6760654292">
<script>
/* Web misafir jetonu (?w=) tasiyan davet linkleri DOGRUDAN canli halka
   sayfasina gider; bu sayfa hic cizilmez.

   ⚠️ Bu blok <head> icinde ve GOVDE BOYANMADAN once calisir. Yonlendirmeyi
   gövdenin sonundaki betige birakirsan marka ekrani bir an gorunur ve
   kullanici bunu "uygulama tanitimi -> basarisiz -> teselli sayfasi" diye
   okur (kullanici geri bildirimi, 30 Agu 2026). Buradan asagi tasima.

   Davet kodu da tasiniyor (&c=): halka.html "Uygulamada ac" dugmesini
   ancak kodu bilirse dogru halkaya baglayabilir.

   Zikir listesi paylasimi bu daldan MUAF: onun web karsiligi yok. */
(function () {
  try {
    var p = new URLSearchParams(window.location.search);
    var w = (p.get('w') || '').trim();
    if (!w) return;
    if ((p.get('zikir') || '').trim()) return;
    var c = (p.get('code') || p.get('event') || '').toUpperCase().trim();
    if (!/^[A-Z0-9]{4,12}$/.test(c)) c = '';
    window.location.replace('/halka.html?w=' + encodeURIComponent(w) +
                            (c ? '&c=' + encodeURIComponent(c) : ''));
  } catch (e) {}
})();
</script>
<title>Manevi Halka · Join</title>
<!-- Bağlantı önizlemesi (WhatsApp, Telegram, iMessage, X). Davet mesajı yalnız
     "halkaya katıl: bağlantı" diyor; önizleme olmadan alıcı neye davet edildiğini
     göremiyordu (2 Eki 2026, gurbetçi aile senaryosu). Önizleme botları
     betik çalıştırmadığı için tek dil: taban dil İngilizce (Kural 9a). Zikir
     listesi ve tek seferlik halka davetleri de bu sayfayı kullandığı için metin genel. -->
<meta name="description" content="You've been invited to Manevi Halka. Complete the khatm and dhikr together with family and friends.">
<meta property="og:site_name" content="Manevi Halka">
<meta property="og:title" content="Manevi Halka · Invitation">
<meta property="og:description" content="You've been invited. Complete the khatm and dhikr together with family and friends.">

<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<script>
(function () {
  // Tema ILK BOYAMADAN once: sitenin ortak tercihi (mh_theme), yoksa sistem.
  var t = null;
  try { t = localStorage.getItem("mh_theme"); } catch (e) { /* gizli mod */ }
  if (t !== "dark" && t !== "light") {
    try { t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { t = "light"; }
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
  /* 28 Eyl 2026: sitenin yeni gorunumu (ana sayfa, vakit, Ortak Okuma, davet sayfasi ile
     ayni renkler ve yazi tipleri). Yazi tipleri KENDI SUNUCUMUZDAN (SIL OFL). */
  @font-face { font-family: "Marcellus"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(/fonts/marcellus-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Marcellus"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(/fonts/marcellus-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Onest"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(/fonts/onest-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Onest"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(/fonts/onest-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root { --page:#f7f4ec; --paper:#fffdf8; --ink:#14231c; --body:#4b5a52; --muted:#7a867f; --green:#1e4d35; --pill:#1e4d35;
    --mint:#e8f2ea; --gold:#8a6a22; --gold-soft:#c9a55a; --line:color-mix(in srgb, #14231c 10%, transparent);
    --display:"Marcellus", "Iowan Old Style", Georgia, serif; --sans:"Onest", -apple-system, "Segoe UI", system-ui, sans-serif; }
  :root[data-theme="dark"] { color-scheme:dark; --page:#0e1a14; --paper:#152720; --ink:#eaf3ee; --body:#b9c8c0; --muted:#8fa298;
    --green:#8fd3ae; --pill:#2f6b4a; --mint:#1d3227; --gold:#d9b563; --gold-soft:#d9b563; --line:color-mix(in srgb, #eaf3ee 12%, transparent); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--page); color: var(--ink); min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px 16px; overflow-x: clip; -webkit-font-smoothing: antialiased; }
  .card { max-width: 420px; width: 100%; background: var(--paper); border-radius: 28px; padding: 36px 24px 26px;
    text-align: center; border: 1px solid var(--line); box-shadow: 0 30px 60px -36px rgba(10, 30, 20, .45); }
  /* Logo, sitenin tesbih halkasi motifiyle cevrili (ana sayfadaki noktali halka). */
  .logo-wrap { position: relative; width: 104px; height: 104px; margin: 0 auto 16px; display: grid; place-items: center; }
  .logo-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--gold-soft); }
  .logo-wrap img { width: 76px; height: 76px; display: block; border-radius: 19px; }
  .brand-name { font-size: 11.5px; color: var(--gold); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.12; color: var(--ink); margin-bottom: 10px; text-wrap: balance; }
  :root[lang="ar"] h1 { font-family: inherit; font-weight: 700; font-size: 26px; line-height: 1.35; }
  :root[lang="ar"] .brand-name { letter-spacing: 0; }
  .subtitle { color: var(--body); font-size: 15px; line-height: 1.55; margin-bottom: 24px; }
  .code-box { background: var(--mint); border-radius: 18px; padding: 14px; margin-bottom: 22px; }
  .code-label { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 4px; }
  :root[lang="ar"] .code-label { letter-spacing: 0; text-transform: none; font-size: 13px; }
  /* Kod tek aralikli kalir: 0 ile O, 1 ile I karismasin (kisi kodu elle de girebiliyor). */
  .code { font-size: 26px; font-weight: 700; color: var(--green); letter-spacing: .18em; font-family: "SF Mono", Menlo, Consolas, monospace; direction: ltr; }
  .btn { display: block; width: 100%; background: var(--pill); color: #fff; text-decoration: none; padding: 14px 20px;
    border-radius: 999px; font-size: 15.5px; font-weight: 700; margin-bottom: 12px; border: none; cursor: pointer; }
  .btn:hover, .btn:active { filter: brightness(1.08); }
  .hint { color: var(--muted); font-size: 13.5px; margin-top: 16px; line-height: 1.5; }
  .store-row { display: flex; gap: 10px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
  .store-row a { text-decoration: none; color: var(--green); font-size: 14px; font-weight: 700; padding: 10px 18px;
    border-radius: 999px; border: 1px solid var(--line); background: transparent; }
  .store-row a:hover { background: var(--mint); border-color: transparent; }
  .footer { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }
  .footer a { color: var(--body); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; border-radius: 6px; }
  #fallback { display: none; }
  #fallback.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap"><svg viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="49" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 9.6"/></svg><img src="/email/icon.png" alt="Manevi Halka" width="76" height="76"></div>
    <div class="brand-name">Manevi Halka</div>
    <h1>Join the Circle</h1>
    <p class="subtitle" id="status">
      Opening Manevi Halka…
    </p>

    <div class="code-box" id="codeBox" style="display:none">
      <div class="code-label">Invite Code</div>
      <div class="code" id="codeText"></div>
    </div>

    <div id="fallback">
      <a href="#" class="btn" id="openAppBtn">Open App</a>
      <p class="hint">Don’t have the app yet?</p>
      <div class="store-row">
        <a href="https://apps.apple.com/app/manevi-halka/id6760654292" id="iosBtn">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.emrhnayz.spiritualcircle" id="androidBtn">Google Play</a>
      </div>
    </div>

    <div class="footer">
      <a href="/" id="homeLink">manevihalka.app</a>
      <a href="/privacy-en.html" id="privacyLink">Privacy</a>
      <a href="/terms-en.html" id="termsLink">Terms</a>
    </div>
  </div>

<script>
  (function () {
    // ── DİL ────────────────────────────────────────────────────────────────
    // Sayfa 5 dilli. Taban İNGİLİZCE: eşleşmeyen tarayıcı dili Türkçeye değil
    // İngilizceye düşer (uygulamadaki Kural 9 ile aynı ilke). Uygulama adı
    // "Manevi Halka" beş dilde de sabittir, çevrilmez.
    var STRINGS = {
      en: { join: 'Join the Circle', zikir: 'Dhikr List', opening: 'Open the app, or install it below.',
            inviteCode: 'Invite Code', shareCode: 'Share Code', openApp: 'Open App',
            hint: 'Don’t have the app yet?',
            invalid: 'Invalid invitation link.',
            privacy: 'Privacy', terms: 'Terms', title: 'Manevi Halka · Join' },
      tr: { join: 'Halkaya Katıl', zikir: 'Zikir Listesi', opening: 'Uygulaman varsa aç, yoksa aşağıdan indir.',
            inviteCode: 'Davet Kodu', shareCode: 'Paylaşım Kodu', openApp: 'Uygulamayı Aç',
            hint: 'Uygulaman yok mu?',
            invalid: 'Geçersiz davet bağlantısı.',
            privacy: 'Gizlilik', terms: 'Şartlar', title: 'Manevi Halka · Katıl' },
      de: { join: 'Dem Kreis beitreten', zikir: 'Dhikr-Liste', opening: 'Öffne die App oder installiere sie unten.',
            inviteCode: 'Einladungscode', shareCode: 'Freigabecode', openApp: 'App öffnen',
            hint: 'Du hast die App noch nicht?',
            invalid: 'Ungültiger Einladungslink.',
            privacy: 'Datenschutz', terms: 'Nutzungsbedingungen', title: 'Manevi Halka · Beitreten' },
      fr: { join: 'Rejoindre le cercle', zikir: 'Liste de dhikr', opening: 'Ouvre l’application, ou installe-la ci-dessous.',
            inviteCode: 'Code d’invitation', shareCode: 'Code de partage', openApp: 'Ouvrir l’application',
            hint: 'Tu n’as pas encore l’application ?',
            invalid: 'Lien d’invitation invalide.',
            privacy: 'Confidentialité', terms: 'Conditions', title: 'Manevi Halka · Rejoindre' },
      ar: { join: 'انضم إلى الحلقة', zikir: 'قائمة الأذكار', opening: 'افتح التطبيق، أو ثبّته من الأسفل',
            inviteCode: 'رمز الدعوة', shareCode: 'رمز المشاركة', openApp: 'فتح التطبيق',
            hint: 'أليس لديك التطبيق بعد؟',
            invalid: 'رابط دعوة غير صالح.',
            privacy: 'الخصوصية', terms: 'الشروط', title: 'Manevi Halka · انضمام' }
    };
    // Politika sayfası son eki — permalink şeması /:basename.html (İNGİLİZCE
    // dosyalar `-en` ekli, TÜRKÇE olanlar eksiz). Şemayı değiştirme: aynı
    // adresler lib/legal.ts, ASC gizlilik alanı ve App Description'da sabit.
    var POLICY_SUFFIX = { en: '-en', tr: '', de: '-de', fr: '-fr', ar: '-ar' };

    // Dil sirasi: sitede secilen dil (mh_lang, ortak anahtar) > tarayici > en.
    var saved = ''; try { saved = (localStorage.getItem('mh_lang') || '').slice(0, 2); } catch (e) {}
    var lang = STRINGS[saved] ? saved : (navigator.language || 'en').slice(0, 2).toLowerCase();
    if (!STRINGS[lang]) lang = 'en';
    var T = STRINGS[lang];

    document.documentElement.lang = lang;
    if (lang === 'ar') document.documentElement.dir = 'rtl';
    document.title = T.title;
    document.getElementById('homeLink').href = ({ en: '/', tr: '/tr/', de: '/de/', fr: '/fr/', ar: '/ar/' })[lang];

    document.querySelector('h1').textContent = T.join;
    document.querySelector('.code-label').textContent = T.inviteCode;
    document.querySelector('.hint').textContent = T.hint;
    document.getElementById('openAppBtn').textContent = T.openApp;

    var priv = document.getElementById('privacyLink');
    var term = document.getElementById('termsLink');
    priv.textContent = T.privacy; priv.href = '/privacy' + POLICY_SUFFIX[lang] + '.html';
    term.textContent = T.terms;   term.href = '/terms'   + POLICY_SUFFIX[lang] + '.html';

    var params = new URLSearchParams(window.location.search);
    // 'code' = grup daveti, 'event' = tek seferlik halka daveti. İkisi aynı
    // deep link'e (manevisosyal://join/CODE) gider; app kodu grup VEYA event
    // olarak çözer.
    // 'zikir' = paylaşılan zikir listesi. TİPİ deep link'te de taşırız
    // (manevisosyal://join?zikir=CODE): app tarafındaki çözüm deterministik
    // kalsın diye /join/CODE biçimine DÜŞÜRÜLMEZ (o biçim tipsizdir ve app onu
    // grup→event sırasıyla dener; zikir orada kaybolur).
    var zikir = (params.get('zikir') || '').toUpperCase().trim();
    var code = zikir || (params.get('code') || params.get('event') || '').toUpperCase().trim();
    var statusEl = document.getElementById('status');
    statusEl.textContent = T.opening;
    var codeBox = document.getElementById('codeBox');
    var codeText = document.getElementById('codeText');
    var fallback = document.getElementById('fallback');
    var openAppBtn = document.getElementById('openAppBtn');

    if (!code || !/^[A-Z0-9]{4,12}$/.test(code)) {
      statusEl.textContent = T.invalid;
      fallback.classList.add('show');
      return;
    }

    codeText.textContent = code;
    codeBox.style.display = 'block';

    // Zikir paylaşımında başlık/etiket bağlama uysun.
    if (zikir) {
      var h1 = document.querySelector('h1');
      if (h1) h1.textContent = T.zikir;
      var label = document.querySelector('.code-label');
      if (label) label.textContent = T.shareCode;
    }

    var deepLink = zikir
      ? 'manevisosyal://join?zikir=' + zikir
      : 'manevisosyal://join/' + code;
    openAppBtn.href = deepLink;

    /* ⚠️ BURADA ESKIDEN OTOMATIK UYGULAMA ACMA DENEMESI VARDI. GERI KOYMA.
       iOS'ta gizli iframe, Android'de window.location.href ile ozel semaya
       (manevisosyal://) gidiliyor, 2500 ms bekleniyor, sonra yedege
       dusuluyordu. 30 Agu 2026'da iki platformda da OLCULDU: uygulama kurulu
       olmasina ragmen ikisinde de uygulama ACILMADI, sure dolup yedege
       dusuldu. Sebep ortak: tarayicilar OTOMATIK sema gecisini engelliyor,
       yalniz KULLANICI DOKUNUSUYLA tetiklenene izin veriyor.
       (Chrome'un kabul ettigi bicim intent:// -- bizimki o degil.)

       Yani o 2500 ms hicbir sey satin almiyordu; uygulamayi acan tek sey
       isletim sistemi duzeyindeki Universal Link / App Links (o da bu sayfa
       hic yuklenmeden devreye girer) ve asagidaki dugme. Bu yuzden yedek
       ARTIK HEMEN gosteriliyor. */
    fallback.classList.add('show');
  })();
</script>
</body>
</html>
