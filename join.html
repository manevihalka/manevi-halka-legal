/* Web misafir jetonu (?w=) tasiyan davet linkleri DOGRUDAN canli halka

   ⚠️ Bu blok <head> icinde ve GOVDE BOYANMADAN once calisir. Yonlendirmeyi

   Zikir listesi paylasimi bu daldan MUAF: onun web karsiligi yok. */
(function () {
  try {
    var p = new URLSearchParams(window.location.search);
    var w = (p.get('w') || '').trim();
    if (!w) return;
    if ((p.get('zikir') || '').trim()) return;
    var c = (p.get('code') || p.get('event') || '').toUpperCase().trim();
    if (!/^[A-Z0-9]{4,12}$/.test(c)) c = '';
    window.location.replace('/halka.html?w=' + encodeURIComponent(w) +
                            (c ? '&c=' + encodeURIComponent(c) : ''));
  } catch (e) {}
})();

            inviteCode: 'رمز الدعوة', shareCode: 'رمز المشاركة', openApp: 'فتح التطبيق',
            getIos: 'حمّله من App Store', haveApp: 'هل لديك التطبيق بالفعل؟',
            hint: 'أليس لديك التطبيق بعد؟', howto: 'كيف أنضم؟ خطوة بخطوة',
            after: 'بعد التثبيت، اضغط على الرابط في رسالتك مرة أخرى، أو انسخه من هنا والصقه في التطبيق: تبويب <b>الحلقات</b>، ثم <b>انضم برمز دعوة</b>.',
            copy: 'انسخ الرابط', copied: 'تم النسخ',
            invalid: 'رابط دعوة غير صالح.',
            privacy: 'الخصوصية', terms: 'الشروط', title: 'Manevi Halka · انضمام' }
    };
    // Politika sayfası son eki — permalink şeması /:basename.html (İNGİLİZCE
    // dosyalar `-en` ekli, TÜRKÇE olanlar eksiz). Şemayı değiştirme: aynı
    // adresler lib/legal.ts, ASC gizlilik alanı ve App Description'da sabit.
    var POLICY_SUFFIX = { en: '-en', tr: '', de: '-de', fr: '-fr', ar: '-ar' };

    // Dil sirasi: sitede secilen dil (mh_lang, ortak anahtar) > tarayici > en.
    var saved = ''; try { saved = (localStorage.getItem('mh_lang') || '').slice(0, 2); } catch (e) {}
    var lang = STRINGS[saved] ? saved : (navigator.language || 'en').slice(0, 2).toLowerCase();
    if (!STRINGS[lang]) lang = 'en';
    var T = STRINGS[lang];

    // ── PLATFORM ───────────────────────────────────────────────────────────
    // iPadOS 13+ masaüstü Safari gibi "Macintosh" der; dokunmatik noktadan ayrılır.
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS = !isAndroid && (/iPhone|iPad|iPod/i.test(ua) ||
                (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1));

    // Google Play kurulum kaynağı (links.html / indir.html ile aynı desen).
    var PKG = 'com.emrhnayz.spiritualcircle';
    var STORE_PLAY = 'https://play.google.com/store/apps/details?id=' + PKG + '&referrer=' +
      encodeURIComponent('utm_source=manevihalka.app&utm_medium=website&utm_content=join');

    document.documentElement.lang = lang;
    if (lang === 'ar') document.documentElement.dir = 'rtl';
    document.title = T.title;
    document.getElementById('homeLink').href = ({ en: '/', tr: '/tr/', de: '/de/', fr: '/fr/', ar: '/ar/' })[lang];

    document.querySelector('h1').textContent = T.join;
    document.querySelector('.code-label').textContent = T.inviteCode;
    var storeHint = document.getElementById('storeHint');
    storeHint.textContent = T.hint;
    document.getElementById('openAppBtn').textContent = T.openApp;
    // Rehber: _gen/site-urls.mjs REHBER_SAYFA.katil ile AYNI adresler
    var howto = document.getElementById('howtoLink');
    howto.textContent = T.howto;
    howto.href = ({ en: '/guides/join-a-circle/', tr: '/tr/rehber/halkaya-katilma/', de: '/de/anleitungen/kreis-beitreten/', fr: '/fr/guides/rejoindre-un-cercle/', ar: '/ar/dalil/indimam-ila-halqa/' })[lang];

    var priv = document.getElementById('privacyLink');
    var term = document.getElementById('termsLink');
    priv.textContent = T.privacy; priv.href = '/privacy' + POLICY_SUFFIX[lang] + '.html';
    term.textContent = T.terms;   term.href = '/terms'   + POLICY_SUFFIX[lang] + '.html';

    var actions = document.getElementById('actions');
    var openAppBtn = document.getElementById('openAppBtn');
    var iosBtn = document.getElementById('iosBtn');
    var androidBtn = document.getElementById('androidBtn');
    var storeRow = document.getElementById('storeRow');
    androidBtn.href = STORE_PLAY;

    /* Düğme sırası platforma göre:
       - Android: "Uygulamayı aç" (intent://, uygulama yoksa Google Play'e düşer),
         sonra mağazalar Google Play önde.
       - iOS: App Store DOLU birincil düğme; "Uygulamayı aç" ikincil. Safari özel
         şemayı (manevisosyal://) uygulama yokken "adres geçersiz" diye reddediyor,
         yani kurulu olmayan kişi için o düğme hiçbir şey yapmıyordu. Google Play
         iPhone'da işe yaramadığı için mağaza satırı gizlenir.
       - Masaüstü: eskisi gibi, iki mağaza birlikte. */
    if (isIOS) {
      iosBtn.className = 'btn';
      iosBtn.textContent = T.getIos;
      actions.insertBefore(iosBtn, actions.firstChild);
      storeHint.textContent = T.haveApp;
      actions.insertBefore(storeHint, openAppBtn);
      openAppBtn.className = 'btn btn-ghost';
      storeRow.style.display = 'none';
    } else if (isAndroid) {
      storeRow.insertBefore(androidBtn, iosBtn);
    }

    var params = new URLSearchParams(window.location.search);
    // 'code' = grup daveti, 'event' = tek seferlik halka daveti. İkisi aynı
    // deep link'e (manevisosyal://join/CODE) gider; app kodu grup VEYA event
    // olarak çözer.
    // 'zikir' = paylaşılan zikir listesi. TİPİ deep link'te de taşırız
    // (manevisosyal://join?zikir=CODE): app tarafındaki çözüm deterministik
    // kalsın diye /join/CODE biçimine DÜŞÜRÜLMEZ (o biçim tipsizdir ve app onu
    // grup→event sırasıyla dener; zikir orada kaybolur).
    // Eski halkalarda davet bağlantısı kod yerine halkanın uuid'sini taşıyabilir
    // (uygulama `invite_code || id` yazıyor); uygulama /join/<uuid>'yi de çözer.
    var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var zikir = (params.get('zikir') || '').toUpperCase().trim();
    var key = zikir ? 'zikir' : (params.get('code') ? 'code' : 'event');
    var raw = zikir || (params.get('code') || params.get('event') || '').trim();
    var isUuid = !zikir && UUID.test(raw);
    var code = isUuid ? raw.toLowerCase() : raw.toUpperCase();
    var statusEl = document.getElementById('status');
    statusEl.textContent = isIOS ? T.openingIos : T.opening;
    var codeBox = document.getElementById('codeBox');
    var codeText = document.getElementById('codeText');
    var fallback = document.getElementById('fallback');

    if (!isUuid && !/^[A-Z0-9]{4,12}$/.test(code)) {
      statusEl.textContent = T.invalid;
      // Açılacak davet yok: yalnız mağazalar. iOS'ta App Store zaten birincil;
      // öbür platformlarda hiçbir yere gitmeyen "Uygulamayı aç" gizlenir.
      openAppBtn.style.display = 'none';
      if (isIOS) storeHint.style.display = 'none';
      fallback.classList.add('show');
      return;
    }

    codeText.textContent = code;
    if (isUuid) codeText.className = 'code long';
    codeBox.style.display = 'block';

    // Zikir paylaşımında başlık/etiket bağlama uysun.
    if (zikir) {
      howto.parentNode.style.display = 'none'; // rehber halkalar icin; zikir listesi paylasimina uymaz
      var h1 = document.querySelector('h1');
      if (h1) h1.textContent = T.zikir;
      var label = document.querySelector('.code-label');
      if (label) label.textContent = T.shareCode;
    }

    // Uygulamaya giden yol: şema kısmı (manevisosyal://) olmadan.
    var appPath = zikir ? 'join?zikir=' + encodeURIComponent(code)
                        : 'join/' + encodeURIComponent(code);
    /* ANDROID: intent:// biçimi. Chrome ve Chromium tabanlı tarayıcılar bunu
       uygulamaya verir; uygulama KURULU DEĞİLSE S.browser_fallback_url'e, yani
       kurulum kaynağıyla Google Play'e gider. Düz manevisosyal:// ise Chrome'da
       uygulama yokken HİÇBİR ŞEY yapmıyordu. Uygulamanın manifestinde
       manevisosyal şeması BROWSABLE ile kayıtlı; Chrome intent'in verisini
       "manevisosyal://" + appPath diye kurar, yani uygulamaya giden adres düz
       şemayla birebir aynıdır.
       ⚠️ Yalnız DOKUNUŞLA çalışır; aşağıdaki nota bak (otomatik açma yok). */
    var deepLink = isAndroid
      ? 'intent://' + appPath + '#Intent;scheme=manevisosyal;package=' + PKG +
        ';S.browser_fallback_url=' + encodeURIComponent(STORE_PLAY) + ';end'
      : 'manevisosyal://' + appPath;
    openAppBtn.href = deepLink;

    // ── Kurulumdan sonra + bağlantıyı kopyala ─────────────────────────────
    // Kopyalanan şey KODUN kendisi değil BAĞLANTI: uygulamadaki "Davet koduyla
    // katıl" ekranı yapıştırılan bağlantıdan tipi de çıkarır (zikir paylaşımı
    // yalnız kodla grup sanılırdı). Adres sabit: yerelde denerken localhost
    // kopyalanmasın. ?w= taşınmaz (o bağlantılar bu sayfayı hiç çizmez).
    var shareUrl = 'https://manevihalka.app/join.html?' + key + '=' + encodeURIComponent(code);
    var afterBox = document.getElementById('afterBox');
    document.getElementById('afterText').innerHTML = T.after; // sabit metin, kullanıcı verisi yok
    var copyBtn = document.getElementById('copyBtn');
    var copyStatus = document.getElementById('copyStatus');
    copyBtn.textContent = T.copy;
    var statusTimer = 0;
    function copied(ok) {
      clearTimeout(statusTimer);
      if (!ok) {
        // Kopyalanamadıysa kod seçili bırakılır, kişi kendisi kopyalasın.
        try {
          var r = document.createRange(); r.selectNodeContents(codeText);
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        } catch (e) {}
        copyStatus.textContent = '';
        return;
      }
      copyStatus.textContent = T.copied;
      statusTimer = setTimeout(function () { copyStatus.textContent = ''; }, 2600);
    }
    function legacyCopy() {
      var ta = document.createElement('textarea');
      ta.value = shareUrl;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
      document.body.appendChild(ta);
      ta.select();
      try { ta.setSelectionRange(0, shareUrl.length); } catch (e) {}
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      return ok;
    }
    copyBtn.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function () { copied(true); },
          function () { copied(legacyCopy()); });
      } else {
        copied(legacyCopy());
      }
    });
    afterBox.hidden = false;

    /* ⚠️ BURADA ESKIDEN OTOMATIK UYGULAMA ACMA DENEMESI VARDI. GERI KOYMA.
       iOS'ta gizli iframe, Android'de window.location.href ile ozel semaya
       (manevisosyal://) gidiliyor, 2500 ms bekleniyor, sonra yedege
       dusuluyordu. 30 Agu 2026'da iki platformda da OLCULDU: uygulama kurulu
       olmasina ragmen ikisinde de uygulama ACILMADI, sure dolup yedege
       dusuldu. Sebep ortak: tarayicilar OTOMATIK sema gecisini engelliyor,
       yalniz KULLANICI DOKUNUSUYLA tetiklenene izin veriyor.
       (Android'deki intent:// de ayni kurala tabi: yalniz dugmeye dokununca.)

       Yani o 2500 ms hicbir sey satin almiyordu; uygulamayi acan tek sey
       isletim sistemi duzeyindeki Universal Link / App Links (o da bu sayfa
       hic yuklenmeden devreye girer) ve asagidaki dugme. Bu yuzden yedek
       ARTIK HEMEN gosteriliyor. */
    fallback.classList.add('show');
  })();
</script>
<!-- Karti gorunur yapan isaret: yukaridaki betik calistiktan SONRA okunur (bastaki CSS). SILME. -->
<i class="card-end" hidden></i>
<!--NAV:JS-->
<script>
(function () {
  var el = document.getElementById("navLoad");
  if (!el) return;
  var root = document.documentElement, tile = el.querySelector(".nl-tile");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var clickAt = 0, target = "", safety = 0;
  function brandOffset() {
    // Basliktaki ikonun ortadaki ikona gore yeri ve olcegi (gorunmuyorsa null).
    var b = document.querySelector("[data-vt-brand]");
    if (!b) return null;
    var r = b.getBoundingClientRect(), tr = tile.getBoundingClientRect();
    if (!(r.bottom > 0 && r.top < innerHeight && r.width)) return null;
    return "translate(" + (r.left + r.width / 2 - (tr.left + tr.width / 2)) + "px," + (r.top + r.height / 2 - (tr.top + tr.height / 2)) + "px) scale(" + (r.width / tr.width) + ")";
  }
  function hide() { clearTimeout(safety); el.classList.remove("on"); root.classList.remove("nl-leaving", "nl-on", "mh-land"); }
  function shown() { return el.classList.contains("on") && performance.now() - clickAt >= 260; }

  // VARIS: onceki sayfa isaretle ayrildiysa bu sayfa ayni katmanla acildi (mh-land); bugu cozulur,
  // ikon basliktaki yerine ucar.
  if (root.classList.contains("mh-land")) {
    var land = function () {
      var to = reduce ? null : brandOffset(), d = reduce ? 0 : 620;
      var done = function () { el.style.transition = "none"; root.classList.remove("mh-land"); void el.offsetWidth; el.style.transition = ""; };
      if (!el.animate || reduce) { done(); return; }
      if (to) tile.animate([{ transform: "none" }, { transform: to }], { duration: d, easing: "cubic-bezier(.45, 0, .2, 1)", fill: "forwards" });
      // Sayfada baslik ikonu yoksa (giris, indirme sayfalari) ikon yerinde hafifce kuculup soner.
      else tile.animate([{ opacity: 1, transform: "none" }, { opacity: 1, offset: .25 }, { opacity: 0, transform: "scale(.9)" }], { duration: d, easing: "ease", fill: "forwards" });
      // Yalniz bugu cozulur; ikon dolu kalip basliga oturur (ikon katmanin icinde oldugu icin
      // butun katmani soldurmak ikonu da ucarken soluklastiriyordu).
      var veil = el.querySelector(".nl-veil");
      veil.animate([{ opacity: 1 }, { opacity: 1, offset: .25 }, { opacity: 0 }], { duration: d, easing: "ease", fill: "forwards" }).onfinish = function () {
        done();
        veil.getAnimations().concat(tile.getAnimations()).forEach(function (a) { a.cancel(); });
      };
    };
    requestAnimationFrame(function () { requestAnimationFrame(land); });
  }

  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
    var u;
    try { u = new URL(a.href, location.href); } catch (_) { return; }
    if (u.origin !== location.origin) return;
    if (u.pathname === location.pathname && u.search === location.search) return;
    // Hepsi SIMDI ve GECIKMESIZ baslar (Safari, yukaridaki not). Ilk 120 ms animasyonlarin icinde
    // gorunmez tutulur, hizli geciste isaret hic belirmez.
    clickAt = performance.now();
    target = u.pathname;
    root.classList.add("nl-leaving", "nl-on");
    el.classList.add("on");
    if (!reduce && tile.animate) {
      var from = brandOffset() || "scale(.82)";
      tile.animate([{ transform: from, offset: 0 }, { transform: from, offset: .2, easing: "cubic-bezier(.3, .7, .2, 1)" }, { transform: "none" }], { duration: 600 });
    }
    clearTimeout(safety);
    safety = setTimeout(hide, 12000);
    // Gezinme iki kare ertelenir: degisiklik ekrana islensin, animasyonlar baslasin (Safari).
    e.preventDefault();
    var gone = false, go = function () { if (!gone) { gone = true; location.assign(u.href); } };
    requestAnimationFrame(function () { requestAnimationFrame(go); });
    setTimeout(go, 80);
  });
  // Ayrilirken: isaret gorunuyorsa gecis atlanir ve yeni sayfaya "isaretle ac" notu birakilir.
  window.addEventListener("pageswap", function (e) { if (shown() && e.viewTransition) e.viewTransition.skipTransition(); });
  window.addEventListener("pagehide", function () {
    if (shown()) { try { sessionStorage.setItem("mh-land", JSON.stringify({ p: target, t: Date.now() })); } catch (_) {} }
  });
  // geri tusuyla onbellekten donulunce isaret kalmasin
  window.addEventListener("pageshow", function (e) { if (e.persisted) hide(); });
})();
</script>
<!--/NAV:JS-->
