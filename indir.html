  /* Akıllı indirme bağlantısı (manevihalka.app/indir).
     Telefondan açan kişiyi sayfa boyanmadan kendi mağazasına götürür; bilgisayarda
     QR kodu ve iki mağaza düğmesi görünür. Mağaza adresi https olduğu için otomatik
     geçiş tarayıcıda engellenmez (engellenen, özel şemaya otomatik geçiştir; bkz. join.html).
     ?utm_source=... / ?utm_medium=... Google Play kurulum kaynağına aktarılır, böylece
     Play Console'da X, QR vb. ayrı görünür. App Store kampanya ölçümü ASC sağlayıcı
     jetonu (pt) ister, burada yok. Test için ?stay=1 yönlendirmeyi durdurur. */
  (function () {
    var q = new URLSearchParams(location.search);
    var clean = function (v, d) { return ((v || d) + '').replace(/[^A-Za-z0-9._-]/g, '').slice(0, 40) || d; };
    var src = clean(q.get('utm_source'), 'manevihalka.app');
    var med = clean(q.get('utm_medium'), 'indir');
    window.MH_STORE = {
      ios: 'https://apps.apple.com/app/manevi-halka/id6760654292',

    };
    var ua = navigator.userAgent || '';
    var ios = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    window.MH_PLATFORM = ios ? 'ios' : (android ? 'android' : 'other');
    if (q.get('stay') !== '1') {
      if (ios) location.replace(window.MH_STORE.ios);
      else if (android) location.replace(window.MH_STORE.android);
    }
  })();
