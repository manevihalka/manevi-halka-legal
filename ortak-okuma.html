<!--
  Küresel Okuma'nın web karşılığı. Tasarım: manevi-halka reposunda
  docs/WEB_KURESEL_OKUMA.md (kilitli karar belgesi). Önce onu oku.

  ⛔ BU SAYFA `halka.html` DEĞİLDİR, KARIŞTIRMA.
  halka.html: bir DAVETE bağlı, `?w=` gizli jetonu hem kaynağı seçer hem sır
  görevi görür, halkanın sahibi ve bitiş tarihi vardır.
  Bu sayfa: sahibi ve daveti olmayan, sonsuz döngülü, herkese AÇIK tek bir
  kaynak. Bir davet sayfası değil VARIŞ sayfasıdır, bu yüzden `noindex` de
  YOKTUR (halka.html'de vardır ve orada doğrudur).

  ⚠️ TAHTA BU DOSYADA DEĞİL: /js/ortak-hatim.js + /assets/ortak-hatim.css.
  AYNI bileşen ana sayfadaki kartta da çalışıyor. Burada yalnız sayfa kabuğu
  (marka şeridi, hero, mağaza düğmesi, altbilgi) var. ⛔ Bileşen kodunu buraya
  geri kopyalama; iki kopya biri güncellenip öteki bayatlar.
-->
<script>
(function () {
  // ⚠️ index.html'dekiyle AYNI mantık ve AYNI anahtar (mh_theme): iki sayfa
  // arasında gidip gelen kullanıcı tema değişimi yaşamasın. Satır içi ve
  // <head>'de olması şart, yoksa açılışta yanlış temada bir kare çakar.
  var t = null;
  try { t = localStorage.getItem("mh_theme"); } catch (e) { /* gizli mod */ }
  if (t !== "dark" && t !== "light") {
    try {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) { t = "light"; }
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<!-- ⚠️ Palet, girih zemini ve zemin ışıkları ORTAK dosyadan: ana sayfa da
     aynısını kullanıyor. Buraya renk kopyalama, iki sayfa ayrışır. -->
<link rel="stylesheet" href="/assets/site-chrome.css">
<link rel="stylesheet" href="/assets/ortak-hatim.css">
<style>
  /* YALNIZ bu sayfaya özel yerleşim. Palet, zemin ve girih deseni ortak
     dosyada (/assets/site-chrome.css). ⛔ Buraya renk yazma. */
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; padding:0 0 48px; }

  /* Başlık ölçüleri index.html ile BİREBİR: iki sayfa aynı siteymiş gibi
     dursun (kullanıcı geri bildirimi, 9 Eyl 2026: "header daha küçük"). */
  header.site { position:sticky; top:0; z-index:50;
    background:rgba(246,250,247,.82);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid transparent;
    transition:border-color .25s ease; }
  [data-theme="dark"] header.site { background:rgba(14,26,20,.82); }
  header.site.scrolled { border-bottom-color:var(--line); }
  .header-inner { max-width:1080px; margin:0 auto; padding:12px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    color:var(--green); font-weight:700; font-size:16px; letter-spacing:-.2px; }
  .brand img { width:30px; height:30px; border-radius:8px; }
  .header-tools { display:inline-flex; align-items:center; gap:10px; }
  .theme-toggle { width:36px; height:36px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--green);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .theme-toggle svg { width:18px; height:18px; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .lang-picker { position:relative; }
  .lang-btn { display:inline-flex; align-items:center; gap:7px; font:inherit;
    font-size:14px; font-weight:600; color:var(--green); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:7px 11px; cursor:pointer; }
  .lang-btn svg { width:14px; height:14px; fill:currentColor; }
  .lang-list { position:absolute; top:calc(100% + 8px); inset-inline-end:0;
    min-width:168px; list-style:none; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:6px;
    box-shadow:0 14px 34px rgba(17,24,39,.14); z-index:60; }
  [data-theme="dark"] .lang-list { box-shadow:0 14px 34px rgba(0,0,0,.4); }
  .lang-list button { display:block; width:100%; padding:9px 11px; border:0;
    border-radius:8px; background:none; color:var(--ink); font:inherit;
    font-size:14px; text-align:start; cursor:pointer; }
  .lang-list button:hover { background:var(--mint-bg); color:var(--green); }

  .shell { max-width:1080px; margin:0 auto; padding:0 20px; }
  .narrow { max-width:720px; margin:0 auto; }

  /* ⛔ Hero'nun kendi girih deseni YOK: desen artık tüm sayfada (ortak
     dosyada). İkisi birden olsaydı hero'da çift kafes çıkardı. */
  .hero { text-align:center; padding:38px 18px 26px; }
  h1 { font-size:30px; font-weight:800; line-height:1.25; color:var(--green);
    letter-spacing:-.4px; }
  .hero-rule { width:44px; height:1px; background:#d9b970; margin:14px auto; opacity:.8; }
  .hero-sub { font-size:15px; color:var(--body); max-width:480px; margin:0 auto;
    line-height:1.6; }

  .cta { display:block; text-align:center; margin-top:18px; padding:13px;
    border-radius:13px; border:1px solid var(--line); background:var(--mint-bg);
    color:var(--green); text-decoration:none; font-size:14px; font-weight:650; }
  .links { margin-top:26px; text-align:center; font-size:12px; }
  .links a { color:var(--muted); text-decoration:none; margin:0 9px; }
  .hidden { display:none; }
  @media (min-width:900px) { h1 { font-size:36px; } .hero { padding:52px 18px 34px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="site" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="/">
        <img src="/icon.png" alt="" width="30" height="30">
        <span>Manevi Halka</span>
      </a>
      <div class="header-tools">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Tema">
          <svg id="iconMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.5A8.3 8.3 0 0 1 9.5 3.8a8.3 8.3 0 1 0 10.7 10.7z"/></svg>
          <svg id="iconSun" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M21.5 12H19M5 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"/></svg>
        </button>
        <div class="lang-picker" id="lang">
          <button type="button" class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
            <span id="langLbl">Türkçe</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <ul class="lang-list" id="langList" role="listbox" aria-label="Language" hidden>
            <li><button type="button" data-lang="tr" role="option">Türkçe</button></li>
            <li><button type="button" data-lang="en" role="option">English</button></li>
            <li><button type="button" data-lang="de" role="option">Deutsch</button></li>
            <li><button type="button" data-lang="fr" role="option">Français</button></li>
            <li><button type="button" data-lang="ar" role="option">العربية</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <header class="hero">
    <h1 id="title">…</h1>
    <div class="hero-rule"></div>
    <div class="hero-sub" id="heroSub"></div>
  </header>

  <main class="shell">
    <div id="hatimMount"></div>
    <div class="narrow">
      <a class="cta hidden" id="appCta" href="https://apps.apple.com/app/id6760654292"></a>
      <div class="links">
        <a id="homeLink" href="/"></a>
        <a id="privacyLink" href="/privacy.html"></a>
        <a id="termsLink" href="/terms.html"></a>
      </div>
    </div>
  </main>
</div>

<!-- Supabase istemcisi KENDİ SUNUCUMUZDAN. İki sebeple CDN'den alınmıyor:
     (1) bu sayfa misafirden hiçbir şey toplamıyor, CDN'e giden istek her
     ziyaretçinin IP'sini üçüncü bir tarafa verirdi; (2) "@2" kayan sürümdü,
     her yükleme farklı kod getirebilirdi ve SRI konulamıyordu. Sürüm burada
     donduruldu. YALNIZ canlı senkron için; veri çağrıları doğrudan fetch.
     ⚠️ Yol "assets/" ALTINDA, "vendor/" değil: Jekyll'in varsayılan dışlama
     listesi vendor/ alt dizinlerini atıyor. -->
<script src="/assets/vendor/supabase-js-2.112.4.js"></script>
<script src="/js/ortak-hatim.js"></script>
<script>
  // chrome:true -> sayfa başlığı, politika bağlantıları, mağaza düğmesi,
  // canlı senkron ve 20 sn yoklama bu modda açılır.
  MHOrtakHatim.mount(document.getElementById('hatimMount'), { chrome: true });

  // Tema düğmesi. Tercih mh_theme'de, ana sayfayla ORTAK.
  (function () {
    var btn = document.getElementById('themeToggle');
    var moon = document.getElementById('iconMoon'), sun = document.getElementById('iconSun');
    function paint() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      moon.style.display = dark ? 'none' : '';
      sun.style.display = dark ? '' : 'none';
    }
    paint();
    btn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('mh_theme', next); } catch (e) {}
      paint();
    });
  })();

  // Başlık kaydırınca alt çizgi kazanır (index.html ile aynı davranış).
  (function () {
    var h = document.getElementById('siteHeader');
    function onScroll() { h.classList.toggle('scrolled', window.scrollY > 4); }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  })();

  // Dil seçici. ⚠️ Seçim mh_lang'e yazılır (ana sayfayla ORTAK anahtar) ve
  // 'mh:locale' olayı basılır; bileşen o olayı dinleyip kendini yeniden kuruyor,
  // sayfa başlığı/hero/politika bağlantıları da o sırada güncelleniyor.
  (function () {
    var NAMES = { tr:'Türkçe', en:'English', de:'Deutsch', fr:'Français', ar:'العربية' };
    var box = document.getElementById('lang');
    var btn = document.getElementById('langBtn');
    var lbl = document.getElementById('langLbl');
    var list = document.getElementById('langList');

    function sync() {
      var l = document.documentElement.lang;
      lbl.textContent = NAMES[l] || NAMES.en;
    }
    sync();

    btn.addEventListener('click', function () {
      var opening = list.hidden;
      list.hidden = !opening;
      btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!box.contains(e.target)) {
        list.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    Array.prototype.forEach.call(list.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        var code = b.getAttribute('data-lang');
        try { localStorage.setItem('mh_lang', code); } catch (e) {}
        list.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        document.dispatchEvent(new CustomEvent('mh:locale', { detail: code }));
        sync();
      });
    });
  })();
</script>
</body>
</html>
