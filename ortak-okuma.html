<script src="/js/ortak-hatim.js"></script>
<script>
  // chrome:true -> sayfa başlığı, politika bağlantıları, mağaza düğmesi,
  // canlı senkron ve 20 sn yoklama bu modda açılır. Bileşen dili seçer
  // (?lang > mh_lang > tarayıcı > en) ve <html lang/dir> yazar.
  MHOrtakHatim.mount(document.getElementById('hatimMount'), { chrome: true });

  // ── Kabuk metinleri: bileşenin sözlüğünde olmayanlar (menü, altbilgi) ──
  // Adresler _gen/site-urls.mjs ile AYNI (EV, VAKIT); oradan değişirse burası da.
  (function () {
    var EV = { en: "/", tr: "/tr/", de: "/de/", fr: "/fr/", ar: "/ar/" };
    var VAKIT = { en: "/prayer-times/", tr: "/tr/namaz-vakitleri/", de: "/de/gebetszeiten/", fr: "/fr/horaires-de-priere/", ar: "/ar/mawaqit/" };
    var K = {
      tr: { app: "Uygulama", times: "Vakitler", timesLong: "Namaz vakitleri", read: "Ortak Okuma", contact: "İletişim", sections: "Bölümler", language: "Dil", toDark: "Koyu temaya geç", toLight: "Açık temaya geç",
        socialTitle: "Halkayla bağlantıda kal", socialText: "Günün ayeti her sabah, kandil gecelerinde hatırlatma." },
      en: { app: "The app", times: "Prayer times", timesLong: "Prayer times", read: "Shared Reading", contact: "Contact", sections: "Sections", language: "Language", toDark: "Switch to dark theme", toLight: "Switch to light theme",
        socialTitle: "Stay close to the circle", socialText: "The verse of the day every morning, reminders on the blessed nights." },
      de: { app: "Die App", times: "Gebetszeiten", timesLong: "Gebetszeiten", read: "Gemeinsames Lesen", contact: "Kontakt", sections: "Bereiche", language: "Sprache", toDark: "Zum dunklen Design wechseln", toLight: "Zum hellen Design wechseln",
        socialTitle: "Bleib mit dem Kreis verbunden", socialText: "Jeden Morgen der Vers des Tages, Erinnerungen in den gesegneten Nächten." },
      fr: { app: "L'application", times: "Horaires", timesLong: "Horaires de prière", read: "Lecture commune", contact: "Contact", sections: "Sections", language: "Langue", toDark: "Passer au thème sombre", toLight: "Passer au thème clair",
        socialTitle: "Reste lié au cercle", socialText: "Le verset du jour chaque matin, des rappels lors des nuits bénies." },
      ar: { app: "التطبيق", times: "المواقيت", timesLong: "مواقيت الصلاة", read: "القراءة المشتركة", contact: "تواصل معنا", sections: "الأقسام", language: "اللغة", toDark: "التبديل إلى السمة الداكنة", toLight: "التبديل إلى السمة الفاتحة",
        socialTitle: "ابقَ على صلة بالحلقة", socialText: "آية اليوم كل صباح، وتذكير في الليالي المباركة." }
    };
    var $ = function (id) { return document.getElementById(id); };
    function apply() {
      var l = document.documentElement.lang;
      if (!K[l]) l = "en";
      var k = K[l];
      $("brandLink").href = EV[l];
      $("navApp").href = EV[l]; $("navApp").textContent = k.app;
      $("navTimes").href = VAKIT[l]; $("navTimes").textContent = k.times;
      $("navRead").textContent = k.read;
      $("topNav").setAttribute("aria-label", k.sections);
      $("homeLink").href = EV[l];
      $("footTimes").href = VAKIT[l]; $("footTimes").textContent = k.timesLong;
      $("contactLink").textContent = k.contact;
      $("socialTitle").textContent = k.socialTitle;
      $("socialText").textContent = k.socialText;
      $("langCode").textContent = l.toUpperCase();
      $("langBtn").setAttribute("aria-label", k.language);
      $("langList").setAttribute("aria-label", k.language);
      themeLabel();
      [].forEach.call($("langList").querySelectorAll("button"), function (b) {
        b.setAttribute("aria-selected", b.getAttribute("data-lang") === l ? "true" : "false");
      });
    }
    // Tema: tercih mh_theme'de, sitenin tüm sayfalarıyla ORTAK. Geçiş ana
    // sayfayla aynı: destekleyen tarayıcıda düğmeden yayılan daire, öteki
    // tarayıcılarda ve "hareketi azalt"ta 0,6 sn'lik renk geçişi.
    var root = document.documentElement, themeBtn = $("themeToggle");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function theme() { return root.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
    function themeLabel() {
      var l = K[root.lang] ? root.lang : "en";
      themeBtn.setAttribute("aria-label", theme() === "dark" ? K[l].toLight : K[l].toDark);
    }
    function setTheme(next) {
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("mh_theme", next); } catch (e) { /* gizli mod */ }
      themeLabel();
    }
    themeBtn.addEventListener("click", function () {
      var next = theme() === "dark" ? "light" : "dark";
      if (reduce || !document.startViewTransition) {
        root.classList.add("theme-fade");
        setTheme(next);
        setTimeout(function () { root.classList.remove("theme-fade"); }, 650);
        return;
      }
      var r = themeBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      var t = document.startViewTransition(function () { setTheme(next); });
      t.ready.then(function () {
        root.animate({ clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + end + "px at " + x + "px " + y + "px)"] },
          { duration: 850, easing: "cubic-bezier(.45, 0, .2, 1)", pseudoElement: "::view-transition-new(root)" });
      }).catch(function () {});
    });

    apply();
    document.addEventListener("mh:locale", function () { setTimeout(apply, 0); });

    // Dil seçici: seçim mh_lang'e yazılır (ORTAK anahtar) ve 'mh:locale' basılır;
    // bileşen kendini yeniden kurar, kabuk metinleri de apply() ile güncellenir.
    var box = $("lang"), btn = $("langBtn"), list = $("langList");
    function set(open) { list.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false"); }
    btn.addEventListener("click", function (e) { e.stopPropagation(); set(list.hidden); });
    document.addEventListener("click", function (e) { if (!box.contains(e.target)) set(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !list.hidden) { set(false); btn.focus(); } });
    [].forEach.call(list.querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () {
        var code = b.getAttribute("data-lang");
        try { localStorage.setItem("mh_lang", code); } catch (e) { /* gizli mod */ }
        set(false);
        document.dispatchEvent(new CustomEvent("mh:locale", { detail: code }));
      });
    });
  })();
</script>
</body>
</html>
