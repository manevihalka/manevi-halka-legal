<title>Manevi Halka</title>
<!--
  Web üzerinden hatim katılımı. Tasarım: manevi-halka reposunda
  docs/WEB_HATIM_KATILIMI.md (kilitli karar belgesi).

  EKRAN KURGUSU (24 Ağu 2026, kullanıcı kararı + ChatGPT istişaresi):
  Bu bir LİSTE değil DURUM HARİTASI. 30 sabit, numaralı ve KISMEN DOLABİLEN
  nesne var; kısmi doluluk ızgarayı listeden anlamlı kılıyor (liste ancak her
  satırda sûre/âyet gösterilecekse üstün olurdu, biz o detayı onay ekranına
  taşıdık).

  ⚠️ DOLU CÜZLERİ SONA SIRALAMA. Numaralı bir diziyi doluluğa göre yeniden
  dizmek mekânsal hafızayı bozar. "Müsait" süzgeci zaten doluları kaldırıyor.
  (Uygulamanın kendi ızgarası sona sıralıyor; web'de BİLEREK yapmıyoruz.)

  ⚠️ ÖNERİ KURALI: "sıradaki tamamen boş cüz" DEĞİL, "en küçük numaralı
  BİTMEMİŞ cüzü kapatacak kadar". Herkes yeni cüz açarsa hatim parçalanır,
  her cüzde 2-3 sayfa artık kalır ve son %5 sürünür.

  ⚠️ Bu sayfa veritabanına DOĞRUDAN erişemez. Tek kapı `guest-event` Edge
  Function'ı; misafir RPC'lerinin hiçbiri anon'a açık değil (ölçüldü).

  ⚠️ Anlık senkron sinyali VERİ DEĞİL. Kanal public, sahte mesaj gönderilebilir
  (üretimde denendi). Sinyal gelince payload OKUNMAZ, sunucudan yeniden okunur.
-->
<script>
(function () {
  // Tema ILK BOYAMADAN once: sitenin ortak tercihi (mh_theme), yoksa sistem.
  // Tercih yoksa sistem degisimi canli izlenir. Tema DUGMESI bilerek yok (paletin notuna bak).
  var root = document.documentElement, saved = null, mq = null;
  try { saved = localStorage.getItem("mh_theme"); } catch (e) { /* gizli mod */ }
  try { mq = window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) {}
  function apply() {
    root.setAttribute("data-theme", (saved === "dark" || saved === "light") ? saved : (mq && mq.matches ? "dark" : "light"));
  }
  apply();
  if (saved !== "dark" && saved !== "light" && mq && mq.addEventListener) mq.addEventListener("change", apply);
})();
</script>
<style>
  /* Yazi tipleri KENDI SUNUCUMUZDAN (SIL OFL, fonts/OFL-*.txt); ucuncu tarafa istek yok. */
  @font-face { font-family:"Marcellus"; font-style:normal; font-weight:400; font-display:swap;
    src:url(/fonts/marcellus-latin-ext.woff2) format("woff2");
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family:"Marcellus"; font-style:normal; font-weight:400; font-display:swap;
    src:url(/fonts/marcellus-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family:"Onest"; font-style:normal; font-weight:400 700; font-display:swap;
    src:url(/fonts/onest-latin-ext.woff2) format("woff2");
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family:"Onest"; font-style:normal; font-weight:400 700; font-display:swap;
    src:url(/fonts/onest-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  /* ── Palet ──────────────────────────────────────────────────────────────
     28 Eyl 2026'dan beri sitenin YENİ tasarımından (ana sayfa, vakit sayfası,
     /ortak-okuma.html): aynı renkler, Marcellus başlık, Onest metin. Eski
     girih filigranı ve "Manevi Halka" şeridi kalktı.
     ⚠️ Değişken ADLARI eski kaldı (--bg, --card, --primary...): sayfanın
     JS'i lejantta var(--done) gibi adları doğrudan yazıyor.
     ⚠️ ALTIN (--gold) BİR DURUM RENGİ DEĞİLDİR. İlerleme çubuğuna koyulursa
     "üstlenildi = ödül/başarı" çağrışımı doğuyor ve ekran üç renkli bir
     gösterge paneline dönüyor. Altın yalnız atmosfer aksanı: hero ayracı,
     öneri kartının üst çizgisi, küçük etiketler, seçili cüzün halkası.
     ⚠️ RAKAM Marcellus ile YAZILMAZ: o yazı tipinde sıfır "O" harfi gibi
     ("540" "54O" okunuyor). Sayı taşıyan her şey Onest 600 (vakit sayfasının
     geri sayımı da öyle); Marcellus yalnız sözcüklerde.
     ⚠️ Tema: sitenin ortak tercihi (mh_theme), yoksa sistem. v1 kararı
     korunuyor: 30 saniyelik misafir işlemine tema DÜĞMESİ konmuyor. */
  :root {
    --bg:#f7f4ec; --card:#fffdf8; --ink:#14231c;
    --primary-dark:#1e4d35;              /* vurgulu metin */
    --primary:#1e4d35;                   /* beyaz yazılı dolu zemin */
    --soft-green:#e8f2ea;
    --gold:#c9a55a; --gold-ink:#8a6a22;  /* süs çizgisi / küçük etiket yazısı */
    --muted:#7a867f; --sub:#4b5a52;
    --line:color-mix(in srgb, #14231c 10%, transparent);
    --line-strong:color-mix(in srgb, #14231c 16%, transparent);
    --done:#2f6b4a; --held:color-mix(in srgb, #2f6b4a 42%, #fffdf8);
    --free:color-mix(in srgb, #14231c 8%, #fffdf8);
    --full-bg:color-mix(in srgb, #14231c 4%, #f7f4ec);
    --err:#a8322b;
    --shadow:0 18px 40px -30px rgba(10,30,20,.45);
    --display:"Marcellus", "Iowan Old Style", Georgia, serif;
    --sans:"Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --arabic:"MushafAr", "Scheherazade New", "Noto Naskh Arabic", "Geeza Pro", serif;
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#0e1a14; --card:#152720; --ink:#eaf3ee;
    --primary-dark:#8fd3ae; --primary:#2f6b4a; --soft-green:#1d3227;
    --gold:#d9b563; --gold-ink:#d9b563;
    --muted:#8fa298; --sub:#b9c8c0;
    --line:color-mix(in srgb, #eaf3ee 12%, transparent);
    --line-strong:color-mix(in srgb, #eaf3ee 18%, transparent);
    --done:#7ab894; --held:color-mix(in srgb, #7ab894 40%, #152720);
    --free:color-mix(in srgb, #eaf3ee 9%, #152720);
    --full-bg:#122019;
    --err:#f0a198;
    --shadow:0 18px 40px -26px rgba(0,0,0,.6);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:var(--sans); font-size:16px; line-height:1.5;
    background:var(--bg); color:var(--ink); min-height:100vh;
    padding:0 0 48px; overflow-x:clip; -webkit-font-smoothing:antialiased;
  }
  .shell { max-width:960px; margin:0 auto; padding:0 16px; }
  .narrow { max-width:720px; margin:0 auto; }
  .mid    { max-width:760px; margin:0 auto; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:6px; }

  /* ── Üst şerit: yalnız marka. Menü YOK: davet linkinden gelen kişinin tek işi
     burada; ana sayfaya giden yol marka ve alttaki bağlantılar. */
  .top { max-width:1160px; margin:0 auto; padding:0 20px; height:68px; display:flex; align-items:center; }
  .brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);
    font-family:var(--display); font-size:19px; white-space:nowrap; }
  .brand img { width:30px; height:30px; border-radius:8px; }

  /* ── Hero ───────────────────────────────────────────────────────────────
     Atmosfer yalnız tipografide: Marcellus başlık, altın küçük etiket, ince
     altın ayraç. Animasyon yok, desen yok: davet linkinden gelen kişi 30
     saniyelik bir iş yapıyor, atmosfer onu yavaşlatmamalı. */
  .hero { text-align:center; padding:18px 18px 10px; }
  .hero-mark { width:30px; height:30px; margin:0 auto 12px; display:block; color:var(--gold); }
  .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gold-ink); margin-bottom:10px; }
  :root[lang="ar"] .eyebrow { letter-spacing:0; text-transform:none; font-size:13.5px; }
  h1 { font-family:var(--display); font-weight:400; font-size:clamp(30px, 5.4vw, 46px); line-height:1.12;
    color:var(--ink); text-wrap:balance; max-width:20ch; margin:0 auto; overflow-wrap:anywhere; }
  :root[lang="ar"] h1 { font-family:inherit; font-weight:700; line-height:1.35; }
  .hero-rule { width:44px; height:1px; background:var(--gold); margin:16px auto 12px; opacity:.9; }
  .hero-sub { font-size:16px; color:var(--sub); }
  .hero-date { font-size:13px; color:var(--muted); margin-top:6px; }

  /* ── Kart dili ──────────────────────────────────────────────────────── */
  .panel { background:var(--card); border:1px solid var(--line);
    border-radius:24px; box-shadow:var(--shadow); padding:22px 20px; margin-top:16px; }
  .panel-head { display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gold-ink); margin-bottom:14px; }
  .panel-head svg { width:15px; height:15px; }
  :root[lang="ar"] .panel-head { letter-spacing:0; text-transform:none; font-size:13.5px; }

  /* Üç durumlu ilerleme. Altın YOK, üstlenildi açık yeşil. */
  .bar { height:8px; border-radius:999px; background:var(--free); overflow:hidden; display:flex; }
  .bar > .done { background:var(--done); }
  .bar > .held { background:var(--held); }
  .legend { font-size:12.5px; color:var(--sub); text-align:center; margin-top:12px; line-height:1.6; }
  .legend .k { display:inline-flex; align-items:center; gap:6px; margin:0 6px; white-space:nowrap; }
  .legend .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* Öneri kartı: yumuşak yeşil yüzey, üstte ince altın süs çizgisi. */
  .suggest { position:relative; margin-top:16px; padding:22px 18px; border-radius:22px;
    background:var(--soft-green); text-align:center; overflow:hidden; }
  .suggest::after { content:""; position:absolute; top:0; left:18%; right:18%; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.8; }
  .suggest .cuz { font-size:24px; font-weight:600; letter-spacing:-.01em; color:var(--primary-dark); margin-top:2px; line-height:1.2; }
  .suggest .sub { font-size:13.5px; color:var(--sub); margin-top:4px; }

  /* Çoklu hatim serisi bilgisi. Seri SEÇTİRİLMİYOR (kilitli tasarım): tek
     görev alan misafire çip barı gereksiz bilişsel yük. Ama hangi hatimde
     olduğunu SÖYLEMEK şart, yoksa hatim yarılanmışken "1. Cüz müsait"
     görüp sebebini anlayamıyor. */
  .series-note { text-align:center; font-size:12.5px; color:var(--muted);
    margin-top:26px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .series-note svg { width:13px; height:13px; }

  /* ── Ortak zikir/dua ─────────────────────────────────────────────────────
     Cüz ızgarasından farklı olarak burada KART DEĞİL SATIR var: kalemler az
     (2-5 tane) ve her birinin adı uzun; kare hücrelere sığmaz. */
  .zrow { padding:18px 4px 16px; border-bottom:1px solid var(--line); }
  .panel-head + .zrow { padding-top:4px; }
  .zrow:last-child { border-bottom:0; padding-bottom:4px; }
  .zname { font-family:var(--display); font-size:21px; color:var(--primary-dark); line-height:1.25; }
  :root[lang="ar"] .zname { font-family:inherit; font-weight:700; font-size:18px; }
  .zar { font-family:var(--arabic); font-size:23px; color:var(--ink); margin-top:10px; line-height:1.9;
         direction:rtl; text-align:right; }
  /* Arapça satırının kutusu punto x 1.9 kadar yüksek; çubuk hemen ardına
     gelince göz "bitişik" okuyor. Ayrımı boşlukla veriyoruz. */
  .zrow .bar { margin-top:12px; }
  .znums { display:flex; justify-content:space-between; align-items:baseline;
           gap:10px; margin-top:10px; font-size:12.5px; color:var(--muted); }
  .znums b { font-size:15px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .zmine { font-size:12.5px; color:var(--primary-dark); margin-top:8px; }
  .zlocked { font-size:12.5px; color:var(--muted); margin-top:9px;
             display:flex; align-items:center; gap:6px; }
  .zlocked svg { width:13px; height:13px; }
  /* Satırdaki "Sayıma katıl" açık renk: kalemler alt alta dizildiğinde koyu
     tam genişlik haplar listeyi düğme duvarına çeviriyordu. Genişte düğme
     sayının yanına oturur (yerleşim yalnız CSS'te, DOM sırası değişmedi). */
  .zrow > .primary { background:var(--soft-green); color:var(--primary-dark); }
  .zrow > .primary:hover { filter:none; background:color-mix(in srgb, var(--primary-dark) 16%, var(--card)); }
  @media (min-width:560px) {
    .zrow { display:grid; grid-template-columns:minmax(0, 1fr) auto; grid-auto-flow:row dense; column-gap:18px; }
    .zrow > * { grid-column:1 / -1; }
    .zrow > .znums { grid-column:1; align-self:center; }
    .zrow > .primary { grid-column:2; align-self:center; width:auto; min-width:164px; margin-top:10px;
      padding:10px 22px; font-size:14.5px; }
  }

  /* Sayaç ekranı: tek kalem var, ortalı okunur. Satır listesinde ise kalemler
     alt alta diziliyor ve sola dayalı kalması gerekiyor. Bu yüzden ortalama
     .zcount'a bağlı, .zname/.zar'a değil. */
  .zcount { text-align:center; }
  .zcount .zar { text-align:center; margin-top:10px; }

  /* ── Yetişmeyen paylar (pool_divide havuz anı) ───────────────────────────
     Cüz ızgarası DEĞİL: paylar hazır boyutta ve az sayıda (kadro kadar).
     Seçilecek bir aralık yok, üstlenilecek bir satır var. */
  .dlead { text-align:center; font-size:14px; color:var(--sub);
           line-height:1.55; margin:0 0 6px; }
  .drow { padding:16px 4px; border-bottom:1px solid var(--line);
          display:flex; align-items:center; gap:14px; }
  .drow:last-child { border-bottom:0; padding-bottom:4px; }
  .drow .info { flex:1 1 auto; min-width:0; }
  .rng { font-size:19px; font-weight:600; letter-spacing:-.01em; color:var(--primary-dark); line-height:1.3; }
  .panel > .rng { text-align:center; font-size:24px; }
  .drow .sub { font-size:12.5px; color:var(--muted); margin-top:3px; }
  .drow button { width:auto; flex:0 0 auto; margin:0; padding:10px 20px; font-size:14px; }

  /* ── İsteğe bağlı ad ─────────────────────────────────────────────────────
     Ad hiçbir yerde ön koşul değil. Bu yüzden kutu sayfanın ana akışını
     kesmiyor: sessiz bir panel, "Geç" birinci sınıf bir seçenek. */
  .namebox { padding:18px 16px; text-align:center; }
  .namebox .q { font-family:var(--display); font-size:21px; color:var(--primary-dark); }
  :root[lang="ar"] .namebox .q { font-family:inherit; font-weight:700; font-size:17px; }
  .namebox .w { font-size:13px; color:var(--muted); line-height:1.5;
                margin:6px auto 14px; max-width:360px; }
  .namebox input { width:100%; max-width:320px; padding:12px 18px; font-size:15px;
    font-family:inherit; color:var(--ink); background:var(--bg);
    border:1px solid var(--line-strong); border-radius:999px; text-align:center; }
  .namebox input:focus { outline:none; border-color:var(--primary-dark); }
  .namebox .row { display:flex; gap:10px; justify-content:center; margin-top:12px; }
  .namebox .row button { width:auto; flex:0 0 auto; margin:0; padding:11px 24px; font-size:14px; }
  .namerow { display:flex; align-items:center; justify-content:center; gap:10px;
             padding:13px 16px; font-size:13.5px; color:var(--sub); flex-wrap:wrap; }
  .namerow b { color:var(--primary-dark); font-weight:700; }
  .namerow button { width:auto; margin:0; padding:7px 15px; font-size:12.5px; }

  /* Sayaç: halka ŞEKLİ değil DOKUNMA ALANI. Parmak nereye düşerse düşsün
     sayması için bütün daire tıklanabilir; iç metin seçilemez olmalı ki
     hızlı dokunuşta metin seçimi tetiklenmesin. Dış çizgi noktalı: tesbih
     boncuğu, ana sayfadaki halka motifiyle aynı. */
  .zdial { position:relative; width:200px; height:200px; margin:24px auto 0; border-radius:50%;
           background:var(--soft-green); display:flex; flex-direction:column; align-items:center;
           justify-content:center; cursor:pointer; user-select:none;
           -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
           touch-action:manipulation; transition:transform .08s ease; }
  .zdial::before { content:""; position:absolute; inset:-9px; border-radius:50%;
           border:3px dotted var(--gold); opacity:.75; pointer-events:none; }
  .zdial:active { transform:scale(.97); }
  .zdial .v { font-size:52px; font-weight:600; letter-spacing:-.02em; line-height:1;
              color:var(--primary-dark); font-variant-numeric:tabular-nums; }
  .zdial .l { font-size:11.5px; color:var(--muted); margin-top:8px;
              max-width:130px; text-align:center; line-height:1.35; }
  .zchips { display:flex; gap:10px; justify-content:center; margin-top:20px; }
  .zchips button { flex:0 0 auto; width:auto; min-width:96px; padding:10px 18px; margin:0;
                   border-radius:999px; border:1px solid var(--line-strong);
                   background:var(--card); color:var(--primary-dark);
                   font-size:14px; font-weight:700; touch-action:manipulation; }

  .tabs { display:flex; gap:8px; justify-content:center; margin:26px 0 14px; flex-wrap:wrap; }
  .tabs button { flex:0 0 auto; width:auto; padding:8px 18px; border-radius:999px;
    border:1px solid var(--line-strong); background:transparent; color:var(--sub);
    font-size:13.5px; font-weight:600; margin:0; }
  .tabs button:hover { background:var(--soft-green); }
  .tabs button.on { background:var(--soft-green); border-color:transparent; color:var(--primary-dark); }

  /* ── Cüz ızgarası ────────────────────────────────────────────────────
     Zenginlik numaranın tipografisinden geliyor, desenden değil. */
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .cell { position:relative; overflow:hidden; padding:16px 12px 13px;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    cursor:pointer; text-align:center; transition:border-color .15s ease, transform .15s ease; }
  .cell:hover { border-color:var(--line-strong); transform:translateY(-1px); }
  /* Tıklanabilir div'ler: Android Chrome "Dokun ve Ara" div üstündeki metne dokunuşu
     kelime aramasına çeviriyor, cüz kartı açılmıyordu (2 Eki 2026, telefonda görüldü).
     Metin seçilemez + düğme rolü (JS'te). */
  .cell, .zdial { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; }
  .cell .n { font-size:30px; font-weight:600; letter-spacing:-.02em; line-height:1; color:var(--primary-dark); }
  .cell .u { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--gold-ink); margin-top:6px; }
  :root[lang="ar"] .cell .u { letter-spacing:0; text-transform:none; font-size:12.5px; }
  .cell .s { font-size:13px; color:var(--sub); margin-top:8px; }
  .cell .b { height:3px; border-radius:2px; background:var(--free); margin-top:9px; overflow:hidden; }
  .cell .b > i { display:block; height:100%; background:var(--held); }
  /* Dolu kart soluk ama NUMARA OKUNUR kalır. */
  .cell.full { background:var(--full-bg); opacity:.6; cursor:default; }

  function newGuestToken() {
    var a = new Uint8Array(32); crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');

  // sayfa yenilenince misafir kimliği kaybolur ("benim payım" listesi boşalır,
  // tamamladım/iade düğmeleri gider). claim_unit bunu hiç çağırmıyordu ve
  // jetonsuz istek sunucuda bad_token ile düşüyordu (2 Eki 2026).
  function ensureGuestToken() {
    if (!guestToken) {
      guestToken = newGuestToken();
      try { localStorage.setItem(guestKey, guestToken); } catch (e) {}
    }
    return guestToken;
  }

  // ⚠️ Sayfa numarası ÖNDE ve ÇIPLAK, sûre parantezde altta (kullanıcı kararı,
  // üç kez teyit edildi). "Uygulamada sayfa" gibi etiket EKLEME.
  function surahName(n) {
    if (!NAMES || !NAMES[n]) return '';
    return NAMES[n][NAME_IDX[lang]] || NAMES[n][1] || '';
  }
  function refLabel(a, b) {
    if (!REFS) return '';
    var x = REFS[a - 1], y = REFS[b - 1];
    if (!x || !y) return '';
    var fs = x[0].split(':'), ls = y[1].split(':');
    var left = surahName(+fs[0]) + ' ' + fs[1];
    var right = (fs[0] === ls[0]) ? ls[1] : (surahName(+ls[0]) + ' ' + ls[1]);
    // U+2192 bidi tarafından aynalanmaz; Arapçada '←' kullanılır.
    return left + ' ' + T.arrow + ' ' + right;
  }

  // ── Sunucu ────────────────────────────────────────────────────────────────
  // Bot doğrulaması (js/mh-turnstile.js) YALNIZ bu eylemlerde istenir.
  // ⚠️ Liste sunucudakiyle AYNI olmalı: supabase/functions/guest-event/index.ts
  // `isWrite`. Burada eksik kalan bir eylem, secret açılınca 403 alır.
  var WRITE_ACTIONS = { lease:1, commit:1, zikir_contribute:1, claim_unit:1, set_name:1 };

  function call(action, extra, retried) {
    var body = Object.assign({ action: action, web_token: webToken }, extra || {});
    if (guestToken) body.guest_token = guestToken;
    var ts = window.MHTurnstile;
    var needs = !!(WRITE_ACTIONS[action] && ts && ts.enabled());
    var waitTimer = needs ? setTimeout(function () { setWaiting(true); }, 350) : null;
    function done(v) { if (waitTimer) { clearTimeout(waitTimer); setWaiting(false); } return v; }
    function fail(e) { done(); throw e; }
    return (needs ? ts.token() : Promise.resolve(undefined)).then(function (tk) {
      if (tk) body.turnstile = tk;
      return fetch(FN, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'apikey':SUPA_ANON,
                   'Authorization':'Bearer ' + SUPA_ANON },
        body: JSON.stringify(body)
      });
    }).then(function (r) {
      return r.json().then(function (j) { return { status:r.status, body:j }; });
    }).then(function (res) {
      // Jeton süresi dolmuş ya da ağda gecikmiş olabilir: taze jetonla BİR kez
      // daha dene. İkincisi de düşerse kullanıcıya `verify` metni gösterilir.
      if (needs && !retried && res.status === 403 && res.body &&
          res.body.error === 'verification_failed') {
        return call(action, extra, true);
      }
      return res;
    }).then(done, fail);
  }

  function setWaiting(on) {
    var w = document.getElementById('mh-wait');
    if (!w) {
      w = document.createElement('div');
      w.id = 'mh-wait';
      w.setAttribute('role', 'status');
      w.textContent = T.wait;
      document.body.appendChild(w);
    }
    document.body.classList.toggle('mh-waiting', !!on);
  }

  /**
   * Üç durumlu ilerleme.
   * ⚠️ ALTIN KULLANMA. "üstlenildi"yi altın yapmak onu ödül/başarı gibi
   * gösteriyor ve ekranı üç renkli bir gösterge paneline çeviriyor.
   * Üstlenildi = yeşilin açık tonu (--held); altın atmosfer aksanı olarak
   * hero ayracında, öneri kartında ve seçili cüzde kalır.
   */
  function progressNode() {
    var done = 0, held = 0, total = 0;
    board.series.forEach(function (x) {
      total += x.total; done += x.done; held += (x.taken - x.done);
    });
    var free = Math.max(0, total - done - held);

    var wrap = el('div', 'panel');
    wrap.appendChild(panelHead(board.type === 'cevsen' ? T.ongoingCevsen : T.ongoing, ICON_PROGRESS));
    var bar = el('div', 'bar');
    var d = el('div', 'done'); d.style.width = (done / Math.max(1,total) * 100) + '%';
    var h = el('div', 'held'); h.style.width = (held / Math.max(1,total) * 100) + '%';
    bar.appendChild(d); bar.appendChild(h);
    wrap.appendChild(bar);

    var lg = el('div', 'legend');
    [[T.lgDone, done, 'var(--done)'], [T.lgHeld, held, 'var(--held)'],

  function unitLabel(a, b) {
    return board.type === 'cevsen' ? fmt(T.dBab, { a:a, b:b })
                                   : fmt(T.pagesRange, { a:a, b:b });
  }
  function unitCount(n) {
    return board.type === 'cevsen' ? fmt(T.dBabCount, { p:n })
                                   : fmt(T.pageCount,  { p:n });
  }

  /**
   * Yetişmeyen paylar tahtası (pool_divide).
   *
   * ⚠️ Bu halkaya web'den BAŞTAN katılınamaz: külliyat dağıtımda kayıtlı kişilere
   * bölünür ve kadro kilitlenir, dönmeyen misafire pay verilirse o pay havuz
   * açılana kadar ölü kalır. Sayfanın anlamı "halkaya katıl" değil, havuz
   * açıldıktan sonra "yetişmeyen payı üstlen".
   */
  function renderDivideBoard() {
    mode = 'board';
    renderHeader();
    var host = $('stage'); host.innerHTML = '';
    var mid = el('div', 'mid'); host.appendChild(mid);
    mid.appendChild(divideProgressNode());

    // Kopya bileşen YAZMA: pool_claim ile aynı myNode() kullanılıyor. Sunucu
    // 'mine' alanlarını bilerek aynı adlarla döndürüyor (20260825f).
    var mn = myNode(); if (mn) mid.appendChild(mn);
    // Erken dönüşlerden ÖNCE: "açık pay yok" hâlinde de adını düzenleyebilmeli.
    var nnTop = nameNode(); if (nnTop) mid.appendChild(nnTop);

    var open = board.open || [];
    if (!open.length) {
      // İki ayrı sebep, iki ayrı cümle: havuz henüz AÇILMADI mı, yoksa açıldı
      // da her payın sahibi mi var? Tek mesaj ikisini de yanlış anlatır.
      if (!board.released && board.release_at) {
        var d = '';
        try {
          d = new Date(board.release_at).toLocaleDateString(LOCALE_TAG[lang],
                { day:'numeric', month:'long' });
        } catch (e) {}
        mid.appendChild(el('div', 'msg', fmt(T.dWait, { d: d })));
      } else {
        mid.appendChild(el('div', 'msg', T.dNone));
      }
      showAppCta();
      return;
    }

    if (board.slots_left <= 0) { mid.appendChild(el('div', 'msg', T.quota)); showAppCta(); return; }

    var panel = el('div', 'panel');
    panel.appendChild(panelHead(T.dHead, ICON_HANDOFF));
    panel.appendChild(el('div', 'dlead', T.dLead));
    open.forEach(function (u) {
      var row = el('div', 'drow');
      var info = el('div', 'info');
      info.appendChild(el('div', 'rng', unitLabel(u.start, u.end)));
      var sub = unitCount(u.len);
      // Sûre atfı yalnız Kuran'da anlamlı; Cevşen'de bab adı tablosu yok.
      if (board.type !== 'cevsen') {
        var r = refLabel(u.start, u.end);
        if (r) sub += ' · ' + r;
      }
      info.appendChild(el('div', 'sub', sub));
      row.appendChild(info);
      var b = el('button', 'primary', T.dTake);
      b.onclick = function () { claimUnit(u.id); };
      row.appendChild(b);
      panel.appendChild(row);
    });
    mid.appendChild(panel);
    showAppCta();
  }

  // ⚠️ DOM'u progressNode() ile birebir aynı tutuyoruz (.panel > head + .bar +
  // .legend). Ayrı bir kabuk ("panel-body" gibi) uydurmak iki tahtayı görsel
  // olarak ayrıştırır; ortak stil zaten bu yapıya göre yazılmış.
  /**
   * Cevşen ortak havuzu (pool_claim, kind='bab').
   *
   * ⚠️ KURAN TAHTASININ KOPYASI DEĞİL. Orada cüz ızgarası SEÇİCİDİR (kullanıcı
   * cüze dokunur, sonra miktar seçer). Cevşen'in 101 bölümünün cüz gibi
   * geleneksel bir alt bölümü YOKTUR; hücre seçtirmek olmayan bir birim icat
   * etmek olurdu. Bu yüzden burada harita SALT OKUNURDUR, üstlenme doğrudan
   * miktar seçicisinden yapılır. Karar ve gerekçe: ana repo
   * supabase/migrations/20260830_cevsen_claim_pool.sql başı.
   *
   * Kopya bileşen YAZILMADI: ilerleme çubuğu (progressNode), "aldığın
   * bölümler" (myNode) ve ad paneli (nameNode) Kuran tahtasıyla ORTAK —
   * sunucu alan adlarını bilerek aynı döndürüyor.
   */
  function renderBabBoard() {
    mode = 'board';
    renderHeader();
    var host = $('stage'); host.innerHTML = '';
    var mid = el('div', 'mid'); host.appendChild(mid);

    // Harita AYRI panel DEĞİL: ilerleme çubuğuyla aynı veriyi anlatıyor, ikisini
    // ayırmak aynı şeyi iki başlık altında tekrarlamak olurdu. Çubuk "ne kadar",
    // harita "nerede" der; birlikte tek panelde dururlar.
    var prog = progressNode();
    var mp = board.map || [];
    if (mp.length) {
      var grid = el('div', 'babmap');
      mp.forEach(function (st) {
        grid.appendChild(el('div', 'babcell' + (st === 2 ? ' done' : st === 1 ? ' held' : '')));
      });
      prog.appendChild(grid);
    }
    mid.appendChild(prog);
    var mn = myNode(); if (mn) mid.appendChild(mn);
    var nn = nameNode(); if (nn) mid.appendChild(nn);

    if (!board.joinable) { mid.appendChild(el('div', 'msg', T.closed)); showAppCta(); return; }
    if (board.quota_left <= 0) { mid.appendChild(el('div', 'msg', T.quota)); showAppCta(); return; }

    var g = board.suggestion;
    if (!g) { mid.appendChild(el('div', 'msg', T.bAllTaken)); showAppCta(); return; }

    // ── Miktar seçici ─────────────────────────────────────────────────────
    // Adımlar Kuran'daki "5'in katları" kuralının aynısı; boşluk küçükse
    // kırpılır ve "kalanın hepsi" tek seçenek olarak kalır. Kota da kırpar.
    var maxLen = Math.min(g.gap_len, board.quota_left);
    var steps = [5, 10, 20].filter(function (n) { return n < maxLen; });
    steps.push(maxLen);
    if (babLen == null || steps.indexOf(babLen) < 0) babLen = steps[0];

    var box = el('div', 'panel');
    box.appendChild(panelHead(T.bNext, ICON_NEXT));
    box.appendChild(el('div', 'rng', fmt(T.dBab, { a: g.start_page, b: g.start_page + babLen - 1 })));
    var amt = el('div', 'amt');
    amt.appendChild(el('div', 'lbl', T.bHowMany));
    var row = el('div', 'chips');
    steps.forEach(function (n) {
      var b = el('button', n === babLen ? 'on' : '', fmt(T.dBabCount, { p: n }));
      b.onclick = function () { babLen = n; renderAnyBoard(); };
      row.appendChild(b);
    });
    amt.appendChild(row);
    box.appendChild(amt);

    var ok = el('button', 'primary', T.dTake);
    ok.onclick = function () {
      takeBlock({ series: g.series, start_page: g.start_page, end_page: g.start_page + babLen - 1 });
    };
    box.appendChild(ok);
    mid.appendChild(box);
    showAppCta();
  }

  function divideProgressNode() {
    var total = Math.max(1, board.total || 0);
    var done = board.done || 0, held = board.taken || 0;
    var free = Math.max(0, total - done - held);

    var wrap = el('div', 'panel');
    wrap.appendChild(panelHead(
      board.type === 'cevsen' ? T.ongoingCevsen : T.ongoing, ICON_PROGRESS));
    var bar = el('div', 'bar');
    var d = el('div', 'done'); d.style.width = (done / total * 100) + '%';
    var h = el('div', 'held'); h.style.width = (held / total * 100) + '%';
    bar.appendChild(d); bar.appendChild(h);
    wrap.appendChild(bar);

    var lg = el('div', 'legend');
    [[T.lgDone, done, 'var(--done)'], [T.lgHeld, held, 'var(--held)'],
     [T.lgFree, free, 'var(--free)']].forEach(function (x) {
      var k = el('span', 'k');
      var dot = el('span', 'dot'); dot.style.background = x[2];
      k.appendChild(dot);
      k.appendChild(el('span', null, x[1] + ' ' + x[0]));
      lg.appendChild(k);
    });
    wrap.appendChild(lg);
    return wrap;
  }

  function claimUnit(unitId) {
    if (busy) return;
    busy = true;
    ensureGuestToken();
    stageMessage(T.loading, false);
    call('claim_unit', { unit_id: unitId }).then(function (r) {
      busy = false;
      if (r.status === 200 && r.body.ok) { goBoard(); return; }
      var m = errText(r.body && r.body.error);
      stageMessage(m[0], m[0] === T.error);
      // Pay kapıldıysa tahtayı taze getir, kullanıcı ölü listeye bakmasın.
      if ((r.body && r.body.error) === 'block_taken') setTimeout(goBoard, 1400);
    }).catch(function () { busy = false; stageMessage(T.error, true); });
  }

  var nameSkipped = false;   // "Geç" bu oturumda bir daha sormasın

  /**
   * İSTEĞE BAĞLI ad paneli.
   *
   * ⚠️ Ad hiçbir yerde ÖN KOŞUL değil — bölüm üstlenmek, zikir eklemek,
   * tamamlamak, iade etmek: hepsi adsız çalışır. Bu panel bir kapı değil,
   * bir teklif. "Geç" birinci sınıf seçenek ve basılınca oturum boyunca bir
   * daha sorulmuyor.
   *
   * Yalnız bir iş ÜSTLENMİŞ kişiye gösteriliyor (guest_known): sayfayı açıp
   * çıkacak kişiden ad istemek hem gereksiz hem de boş kayıt üretirdi.
   */
  function nameNode() {
    if (!board.guest_known) return null;

    // Ad zaten varsa: küçük bir satır, değiştir/kaldır.
    if (board.guest_name) {
      var row = el('div', 'namerow');
      // İkon bilerek YOK: satir zaten "Ad: X" diyor, ikon bilgi eklemiyordu.
      var b = el('b', null, board.guest_name);
      row.appendChild(el('span', null, T.nEdit + ': '));
      row.appendChild(b);
      var rm = el('button', 'ghost', T.nClear);
      rm.onclick = function () { saveName(''); };
      row.appendChild(rm);
      var wrap = el('div', 'panel'); wrap.appendChild(row);
      return wrap;
    }

    if (nameSkipped) return null;

    var box = el('div', 'namebox');
    box.appendChild(el('div', 'q', T.nAsk));
    box.appendChild(el('div', 'w', T.nWhy));
    var inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 40; inp.placeholder = T.nPh;
    inp.autocomplete = 'off'; inp.setAttribute('aria-label', T.nPh);
    box.appendChild(inp);
    var row = el('div', 'row');
    var ok = el('button', 'primary', T.nSave);
    ok.onclick = function () { saveName(inp.value); };
    var no = el('button', 'ghost', T.nSkip);
    no.onclick = function () { nameSkipped = true; renderAnyBoard(); };
    // Enter da kaydetsin: mobilde klavyenin "bitti" tuşu doğal beklenti.
    inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); saveName(inp.value); } };
    row.appendChild(ok); row.appendChild(no);
    box.appendChild(row);
    var wrap = el('div', 'panel'); wrap.appendChild(box);
    return wrap;
  }

  function saveName(v) {
    if (busy) return;
    busy = true;
    call('set_name', { name: v }).then(function (r) {
      busy = false;
      if (r.status === 200 && r.body.ok) {
        board.guest_name = (r.body.result && r.body.result.name) || null;
        nameSkipped = false;
        renderAnyBoard();
        return;
      }
      // Ad kaydedilemezse akışı BOZMA: zaten isteğe bağlı bir alan.
      nameSkipped = true;
      renderAnyBoard();
    }).catch(function () { busy = false; nameSkipped = true; renderAnyBoard(); });
  }

  function openCounter(it) { zItem = it; zSession = 0; renderCounter(); }

  /**
   * Sayaç. Serbest sayı girişi BİLEREK YOK: biri "10000" yazarsa halkanın
   * ortak sayacı anlamsızlaşır. Yalnız dokunma ve iki çip (+33/+100) — küresel
   * zikirde alınan kararın aynısı, adımlar tesbih turlarına karşılık geliyor.
   */
  // errMsg: gönderim düştüyse sayaç SAYIYLA BİRLİKTE geri gelir, üstünde not.
  // Eskiden hata ekranı çiziliyor, saydığı sayı ekrandan gidiyordu; tekrar
  // "Sayıma katıl" denince sıfırdan başlıyordu.
  function renderCounter(errMsg) {
    mode = 'count';
    var host = $('stage'); host.innerHTML = '';
    var st = el('div', 'narrow'); host.appendChild(st);
    if (errMsg) st.appendChild(el('div', 'msg err', errMsg));

    var card = el('div', 'block zcount');
    card.appendChild(el('div', 'zname', zItem.latin || ''));
    if (zItem.arabic) card.appendChild(el('div', 'zar', zItem.arabic));
    st.appendChild(card);

    var dial = el('div', 'zdial');
    dial.appendChild(el('div', 'v', nf(zSession)));
    dial.appendChild(el('div', 'l', T.zSession));
    dial.onclick = function () { zSession += 1; renderCounter(); };
    asButton(dial);
    st.appendChild(dial);

    var chips = el('div', 'zchips');
    [33, 100].forEach(function (n) {
      var b = el('button', null, '+' + n);
      b.onclick = function (e) { e.stopPropagation(); zSession += n; renderCounter(); };
      chips.appendChild(b);
    });
    st.appendChild(chips);

    var send = el('button', 'primary', T.zSubmit);
    send.onclick = onContribute;
    st.appendChild(send);
    var no = el('button', 'ghost', T.cancel);
    no.onclick = function () { zItem = null; goBoard(); };
    st.appendChild(no);
  }

  function onContribute() {
    if (zSession <= 0 || busy) { return; }
    // busy: yoklama ve yayın sinyali bu sürede tahtayı YENİDEN ÇİZMESİN. Bot
    // doğrulaması kutucuk isterse istek 2 dakikaya kadar bekliyor; bayrak
    // yokken 20 sn'lik yoklama tahtayı çiziyor, misafir "saydığım 107 gitti"
    // sanıyordu (2 Eki 2026, telefonda görüldü). Öteki yazma akışları zaten
    // busy tutuyor.
    busy = true;
    ensureGuestToken();
    // MUTLAK gönderiyoruz (sunucudaki katkı + bu oturum). Aynı istek iki kez
    // giderse sunucu GREATEST uyguladığı için ikinci gidiş hiçbir şey değiştirmez.
    var absolute = (zItem.mine || 0) + zSession;
    var item = zItem.id;
    stageMessage(T.loading, false);
    call('zikir_contribute', { item: item, count: absolute }).then(function (r) {
      busy = false;
      if (r.status !== 200 || !r.body.ok) {
        var m = errText(r.body && r.body.error);
        renderCounter(m[0]);
        return;
      }
      zItem = null; zSession = 0;
      zJustAdded = true;
      if (zAddedTimer) clearTimeout(zAddedTimer);
      zAddedTimer = setTimeout(function () {
        zJustAdded = false;
        if (mode === 'board') renderAnyBoard();
      }, 4000);
      return loadBoard().then(renderZikirBoard);
    }).catch(function () { busy = false; renderCounter(T.error); });
  }

  function renderBoard() {
    mode = 'board';
    renderHeader();
    var st = $('stage');
    st.innerHTML = '';

    // ⚠️ Geniş ekranda ızgara genişler, ilerleme ve "aldığın bölümler" DAR
    // kalır. Uzun satır okumayı zorlaştırır; boşluk sorununu dekorla değil
    // ızgaranın sütun sayısıyla çözüyoruz.
    var mid = el('div', 'mid');
    mid.appendChild(progressNode());
    var mn = myNode(); if (mn) mid.appendChild(mn);
    var nn = nameNode(); if (nn) mid.appendChild(nn);
    st.appendChild(mid);

    if (!board.joinable) { st.appendChild(el('div', 'msg', T.closed)); showAppCta(); return; }
    if (board.quota_left <= 0) { st.appendChild(el('div', 'msg', T.quota)); showAppCta(); return; }
    if (!board.suggestion) { st.appendChild(el('div', 'msg', T.none)); showAppCta(); return; }

    var sg = suggestNode();
    if (sg) { var w = el('div', 'mid'); w.appendChild(sg); st.appendChild(w); }
    st.appendChild(gridNode());
    // Uygulaması olan kişi pay ALMADAN önce uygulamaya geçebilmeli: düğme
    // yalnız aldıktan sonra çıkıyordu, o ana kadar katkı misafir olarak
    // yazılmış oluyordu (2 Eki 2026). Izgaranın altında, ikincil.
    if (joinCode) showAppCta();
  }

  /**
   * Miktar seçenekleri: 5'in katları + (kat değilse) azami miktarın kendisi.
   * ⚠️ Bu "aralık seçtirmek" DEĞİL: kişi hangi SAYFALARI değil NE KADAR
   * okuyacağını seçiyor, başlangıç yine sunucunun verdiği yer. 20 sayfa
   * taahhüt edemeyen kişi hiç almadan çıkmasın diye (kullanıcı kararı).
   * Parçalanma riski "bitmemiş cüzü kapat" önerisiyle dengeleniyor.
   */
  function amountChoices(max) {
    var out = [];
    for (var n = 5; n < max; n += 5) out.push(n);
    out.push(max);                       // her zaman tamamı da seçilebilir
    return out;
  }

  function renderConfirm() {
    mode = 'confirm';
    var host = $('stage'); host.innerHTML = '';
    var st = el('div', 'narrow'); host.appendChild(st);
    var maxLen = offer.end_page - offer.start_page + 1;
    if (chosenLen == null || chosenLen > maxLen) chosenLen = maxLen;
    var endPage = offer.start_page + chosenLen - 1;

    var box = el('div', 'block');
    // Birim ÖNDE ve büyük: Kuran'da SAYFA, Cevşen'de BAB. Ortak yardımcılar
    // (unitLabel/unitCount) zaten bu ayrımı yapıyor — burada elle
    // T.pagesRange/T.pageCount yazmak Cevşen halkasında "Sayfa 17-21" gibi
    // yanlış bir etiket basar (tarayıcı testinde yakalandı, 30 Ağu 2026).
    box.appendChild(el('div', 'pages', unitLabel(offer.start_page, endPage)));
    // Sûre atfı yalnız Kuran'da anlamlı; Cevşen'de bab adı tablosu YOK.
    if (board.type !== 'cevsen') {
      var r = refLabel(offer.start_page, endPage);
      if (r) box.appendChild(el('div', 'ref', '(' + r + ')'));
    }
    box.appendChild(el('div', 'count', unitCount(chosenLen)));
    st.appendChild(box);

    // Seçenek yalnız birden fazlaysa gösterilir; 5 sayfalık bir bölümde
    // "5 mi 5 mi?" diye sormak anlamsız.
    // ⚠️ Cevşen havuzunda miktar ZATEN tahtada seçildi (renderBabBoard) ve
    // teklif tam o uzunlukta geldi; burada ikinci kez sormak akışı tekrar eder.
    var opts = board.kind === 'bab' ? [] : amountChoices(maxLen);
    if (opts.length > 1) {
      var amt = el('div', 'amt');
      amt.appendChild(el('div', 'lbl', T.amountLbl));
      var row = el('div', 'row');
      opts.forEach(function (n) {
        var b = el('button', n === chosenLen ? 'on' : '', String(n));
        b.onclick = function () { chosenLen = n; renderConfirm(); };
        row.appendChild(b);
      });
      amt.appendChild(row);
      st.appendChild(amt);
    }

    st.appendChild(el('div', 'msg', T.confirmQ));
    var yes = el('button', 'primary', T.confirm); yes.onclick = onConfirm;
    var no = el('button', 'ghost', T.cancel); no.onclick = onCancel;
    st.appendChild(yes); st.appendChild(no);
  }

  function renderDone(claim) {
    mode = 'done';
    var host = $('stage'); host.innerHTML = '';
    var st = el('div', 'narrow'); host.appendChild(st);
    // ⚠️ Birim tipe göre. Cevşen halkasında "Sayfa 17-21 emanet edildi" demek
    // yanlış (tarayıcı testinde yakalandı, 30 Ağu 2026); sûre atfı da Cevşen'de
    // anlamsız — bab adı tablosu YOK.
    var isBab = board && board.type === 'cevsen';
    st.appendChild(el('div', 'ok-title',
      fmt(isBab ? T.entrustedBab : T.entrusted, { a:claim.start_page, b:claim.end_page })));
    if (!isBab) {
      var r = refLabel(claim.start_page, claim.end_page);
      if (r) st.appendChild(el('div', 'ref', '(' + r + ')'));
    }
    st.appendChild(el('div', 'msg', T.mayAccept));
    // Hemen okumak isteyene: aldığı sayfalar burada açılır (26 Eyl 2026).
    // Asıl sonraki adım okumak; "başka bölüm al" o zaman ikincil düğme olur.
    var canRead = !isBab && board && board.type === 'quran' && !!claim.unit_id;
    if (canRead) {
      st.appendChild(readButton({ unit_id: claim.unit_id, start_page: claim.start_page,
        end_page: claim.end_page, confirmed: false }, true));
    }

    if (claim.quota_left > 0) {
      st.appendChild(el('div', 'msg', T.another));
      var b = el('button', canRead ? 'ghost' : 'primary', T.takeAnother);
      b.onclick = function () { goBoard(); };
      st.appendChild(b);
    }
    var rec = el('div', 'recovery');
    rec.appendChild(el('div', null, T.keepLink));
    var cp = el('button', 'ghost', T.copy);
    cp.onclick = function () {
      var url = location.origin + location.pathname + '?w=' + encodeURIComponent(webToken) +
                '&g=' + encodeURIComponent(guestToken);
      if (navigator.clipboard) navigator.clipboard.writeText(url);
      cp.textContent = T.copied;
    };
    rec.appendChild(cp); st.appendChild(rec);
    showAppCta();
  }

  // ── Okuma görünümü (26 Eyl 2026) ─────────────────────────────────────────
  // Misafirin ALDIĞI sayfalar, uygulamanın mushaf metniyle. Sayfa GÖRÜNEN
  // numara (1-604, event_units ile aynı). Veri 20'şerli depolama bloklarında
  // (data/mushaf/<ar|tr|en>/NN.json); blok cüz DEĞİL, yalnız dosya bölümü.
  // ⚠️ "Tamamladım" burada da yalnız kişinin kendi dokunuşu: okuma ekranı
  // açmak/kaydırmak hiçbir şeyi tamamlamaz (uygulamadaki "Okudum" kuralı).
  var RT = RD[lang] || RD.en;
  var rdMeal = RD_MEAL_DEFAULT[lang] || null;
  var rdScale = 1;
  var rdUnit = null;          // açık bölüm {unit_id, start_page, end_page, confirmed}
  var rdPushed = false;       // geri tuşu okuma ekranını kapatsın diye tarih kaydı
  var rdCache = {};           // url → Promise<json>
  var ICON_BOOK = 'M12 6.5S9.5 4.5 5 4.5v13c4.5 0 7 2 7 2s2.5-2 7-2v-13c-4.5 0-7 2-7 2zM12 6.5v13';
  var ICON_CLOSE = 'M6 6l12 12M18 6L6 18';

  function rdJson(url) {
    if (!rdCache[url]) {
      rdCache[url] = fetch(url).then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      });
      rdCache[url].catch(function () { delete rdCache[url]; });
    }
    return rdCache[url];
  }
  function rdBlockUrl(kind, v) {
    return '/data/mushaf/' + kind + '/' + ('0' + Math.floor((v - 1) / 20)).slice(-2) + '.json';
  }
  /** [a..b] sayfalarının ayetleri: { "<v>": [[key, text], …] }. */
  function rdPages(kind, a, b) {
    var urls = [];
    for (var v = a; v <= b; v++) { var u = rdBlockUrl(kind, v); if (urls.indexOf(u) < 0) urls.push(u); }
    return Promise.all(urls.map(rdJson)).then(function (list) {
      var out = {};
      list.forEach(function (j) { for (var k in j.p) out[k] = j.p[k]; });
      return out;
    });
  }
  function toArDigits(n) {
    return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[+d]; });
  }
  function rdIconBtn(pathD, label) {
    var b = el('button', 'rd-ic');
    b.type = 'button';
    b.setAttribute('aria-label', label);
    b.appendChild(icon(pathD));
    return b;
  }

  /** Bölüm satırındaki / sonuç ekranındaki "oku" düğmesi (yalnız Kur'an). */
  function readButton(unit, primary) {
    var b = el('button', primary ? 'primary readbtn' : 'readbtn');
    b.type = 'button';
    b.appendChild(icon(ICON_BOOK));
    b.appendChild(el('span', null, primary ? RT.readNow : RT.read));
    b.onclick = function () { openReader(unit); };
    return b;
  }

  function ensureReaderDom() {
    var root = $('reader');
    if (root) return root;
    root = el('div', 'reader hidden');
    root.id = 'reader';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    var bar = el('div', 'rd-bar');
    var close = rdIconBtn(ICON_CLOSE, RT.close);
    close.onclick = function () { closeReader(true); };
    var t = el('div', 't');
    t.appendChild(el('b')); t.appendChild(el('span'));
    var spacer = el('div'); spacer.style.width = '42px'; spacer.style.flex = '0 0 auto';
    bar.appendChild(close); bar.appendChild(t); bar.appendChild(spacer);
    var tools = el('div', 'rd-tools');
    var body = el('div', 'rd-body');
    body.id = 'rdBody';
    root.appendChild(bar); root.appendChild(tools); root.appendChild(body);
    document.body.appendChild(root);
    window.addEventListener('popstate', function () {
      if (!root.classList.contains('hidden')) { rdPushed = false; closeReader(false); }
    });
    return root;
  }

  function renderReaderTools() {
    var root = ensureReaderDom();
    var tools = root.querySelector('.rd-tools');
    tools.innerHTML = '';
    tools.appendChild(el('span', 'lbl', RT.meal));
    var seg = el('div', 'rd-seg');
    [[null, RT.mealOff], ['tr', RT.mealTr], ['en', RT.mealEn]].forEach(function (o) {
      var b = el('button', rdMeal === o[0] ? 'on' : '', o[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', rdMeal === o[0] ? 'true' : 'false');
      b.onclick = function () { if (rdMeal === o[0]) return; rdMeal = o[0]; renderReaderTools(); loadReaderBody(); };
      seg.appendChild(b);
    });
    tools.appendChild(seg);
    var size = el('div', 'rd-size');
    var minus = el('button', 'rd-ic', 'A−'); minus.type = 'button'; minus.setAttribute('aria-label', RT.smaller);
    var plus = el('button', 'rd-ic', 'A+'); plus.type = 'button'; plus.setAttribute('aria-label', RT.larger);
    minus.onclick = function () { rdSetScale(rdScale - 0.1); };
    plus.onclick = function () { rdSetScale(rdScale + 0.1); };
    size.appendChild(minus); size.appendChild(plus);
    tools.appendChild(size);
  }
  function rdSetScale(v) {
    rdScale = Math.max(0.8, Math.min(1.7, Math.round(v * 10) / 10));
    $('reader').style.setProperty('--rd-scale', String(rdScale));
  }

  function openReader(unit) {
    if (!unit || !(unit.start_page > 0) || !(unit.end_page >= unit.start_page)) return;
    rdUnit = unit;
    var root = ensureReaderDom();
    var t = root.querySelector('.rd-bar .t');
    t.firstChild.textContent = unitLabel(unit.start_page, unit.end_page);
    var r = refLabel(unit.start_page, unit.end_page);
    t.lastChild.textContent = r;
    root.setAttribute('aria-label', unitLabel(unit.start_page, unit.end_page));
    root.style.setProperty('--rd-scale', String(rdScale));
    renderReaderTools();
    root.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    if (!rdPushed) { try { history.pushState({ rd: 1 }, ''); rdPushed = true; } catch (e) {} }
    loadReaderBody();
    setTimeout(function () { var c = root.querySelector('.rd-bar .rd-ic'); if (c) c.focus(); }, 30);
  }

  function closeReader(viaButton) {
    var root = $('reader');
    if (!root) return;
    root.classList.add('hidden');
    document.body.style.overflow = '';
    rdUnit = null;
    if (viaButton && rdPushed) { rdPushed = false; try { history.back(); } catch (e) {} }
  }

  function loadReaderBody() {
    var unit = rdUnit;
    if (!unit) return;
    var body = $('rdBody');
    body.innerHTML = '';
    body.appendChild(el('div', 'rd-state', T.loading));
    var a = unit.start_page, b = unit.end_page, meal = rdMeal;
    Promise.all([
      rdJson('/data/mushaf/meta.json'),
      rdPages('ar', a, b),
      meal ? rdPages(meal, a, b) : Promise.resolve(null)
    ]).then(function (res) {
      if (rdUnit !== unit || rdMeal !== meal) return; // bu arada değişti
      renderReaderBody(unit, res[0], res[1], res[2]);
      body.scrollTop = 0;
    }).catch(function () {
      if (rdUnit !== unit) return;
      body.innerHTML = '';
      var st = el('div', 'rd-state', RT.loadErr);
      var rb = el('button', 'ghost', RT.retry);
      rb.type = 'button';
      rb.onclick = loadReaderBody;
      st.appendChild(rb);
      body.appendChild(st);
    });
  }

  function rdSuraHeader(meta, n) {
    var h = el('div', 'rd-sura');
    var ar = (meta.names && meta.names[n]) || '';
    h.appendChild(el('div', 'n', ar ? 'سُورَةُ ' + ar : ''));
    var loc = surahName(n);
    if (loc && lang !== 'ar') h.appendChild(el('div', 'l', fmt(RT.surah, { n: loc })));
    return h;
  }

  function renderReaderBody(unit, meta, arPages, mealPages) {
    var body = $('rdBody');
    body.innerHTML = '';
    for (var v = unit.start_page; v <= unit.end_page; v++) {
      var verses = arPages[v] || [];
      var card = el('section', 'rd-page');
      card.setAttribute('aria-label', fmt(RT.page, { p: v }));
      card.appendChild(el('div', 'rd-pno', fmt(RT.page, { p: v })));
      var mealMap = null;
      if (mealPages && mealPages[v]) { mealMap = {}; mealPages[v].forEach(function (x) { mealMap[x[0]] = x[1]; }); }
      var flow = null;
      verses.forEach(function (x) {
        var key = x[0], parts = key.split(':'), s = +parts[0], ay = +parts[1];
        if (ay === 1) {
          flow = null;
          card.appendChild(rdSuraHeader(meta, s));
          // Fâtiha'da besmele 1. ayettir; Tevbe'de besmele yoktur.
          if (s !== 1 && s !== 9 && meta.basmala) card.appendChild(el('div', 'rd-bsm', meta.basmala));
        }
        var marker = el('span', 'rd-aya', toArDigits(ay));
        marker.setAttribute('aria-label', String(ay));
        if (mealMap) {
          // Meal açık: ayet ayet blok (Arapça + meal).
          var vb = el('div', 'rd-verse');
          var arEl = el('div', 'rd-ar');
          arEl.appendChild(document.createTextNode(x[1] + ' '));
          arEl.appendChild(marker);
          vb.appendChild(arEl);
          var m = el('div', 'rd-m');
          m.setAttribute('dir', 'ltr');
          m.setAttribute('lang', rdMeal);
          m.appendChild(el('span', 'k', s + ':' + ay));
          m.appendChild(document.createTextNode(mealMap[key] || ''));
          vb.appendChild(m);
          card.appendChild(vb);
        } else {
          // Meal kapalı: mushaf gibi akan metin.
          if (!flow) { flow = el('div', 'rd-ar'); card.appendChild(flow); }
          flow.appendChild(document.createTextNode(x[1] + ' '));
          flow.appendChild(marker);
          flow.appendChild(document.createTextNode(' '));
        }
      });
      body.appendChild(card);
    }

    var end = el('div', 'rd-end');
    if (unit.confirmed) {
      end.appendChild(el('div', 'tick', '✓ ' + T.doneMark));
    } else if (unit.unit_id) {
      end.appendChild(el('div', 'q', RT.finishQ));
      var done = el('button', 'primary', T.markDone);
      done.type = 'button';
      done.onclick = function () {
        var id = unit.unit_id;
        closeReader(true);
        confirmClaim(id);
      };
      end.appendChild(done);
    }
    var back = el('button', 'ghost', RT.close);
    back.type = 'button';
    back.style.marginTop = '10px';
    back.onclick = function () { closeReader(true); };
    end.appendChild(back);

    // Uygulamaya hafif bir yönlendirme: sesli dinleme ve kaldığın yerden devam.
    // ⚠️ Otomatik açma YOK (tarayıcılar engelliyor); yalnız dokunuşla. Davet
    // kodu varsa uygulamayı açan derin bağlantı (showAppCta ile aynı kural),
    // yoksa cihazın mağazası.
    var hint = el('div', 'apphint');
    hint.appendChild(document.createTextNode(RT.appHint + ' '));
    var link = el('a', null, RT.appLink);
    link.href = joinCode ? 'manevisosyal://join/' + joinCode
                         : (/Android/i.test(navigator.userAgent || '') ? STORE_PLAY : STORE_IOS);
    hint.appendChild(link);
    end.appendChild(hint);

    var src = el('div', 'rd-src');
    src.appendChild(el('div', null, RT.srcMushaf));
    if (rdMeal === 'tr') src.appendChild(el('div', null, RT.srcTr));
    if (rdMeal === 'en') src.appendChild(el('div', null, RT.srcEn));
    end.appendChild(src);
    body.appendChild(end);
  }

  // ── Akış ──────────────────────────────────────────────────────────────────
  function loadBoard() {
    return call('board').then(function (r) {
      if (r.status !== 200 || !r.body.ok) {
        // Henüz BAŞLAMAMIŞ halka da pano isteğinde not_found döner (yalnız
        // 'active' halkanın panosu var). Eskiden bu "artık mevcut değil" diye
        // gösteriliyordu; davet edilen kişi halkanın silindiğini sanıyordu
        // (2 Eki 2026). Anlık görüntü kayıt aşamasını söyler; 20 sn'lik
        // yoklama başlatılınca panoyu kendiliğinden açar.
        if (r.body && r.body.error === 'not_found') {
          return call('snapshot').then(function (s) {
            var ev = s.status === 200 && s.body && s.body.ok ? s.body.event : null;
            var err = new Error('load');
            if (ev && ev.status === 'registration') {
              if (ev.title) $('title').textContent = ev.title;
              err.userText = T.notStarted;
            } else {
              err.userText = T.gone;
            }
            throw err;
          });
        }
        // Hatim silinmiş / bağlantı geçersiz / hız sınırı: sebebi SÖYLE.
        var m = errText(r.body && r.body.error);
        var err = new Error('load'); err.userText = m[0]; throw err;
      }
      board = r.body.board;
      // Kur'an cüz tahtası (web_board) 'type' DÖNDÜRMÜYOR, yalnız
      // web_any_board'un eklediği kind='cuz' var. type'a bakan her yer
      // (okuma düğmeleri, başlıktaki açık kitap) bu yüzden hiç devreye
      // girmiyordu: 26 Eyl'de eklenen "aldığın sayfaları oku" Kur'an
      // havuzunda görünmüyordu (2 Eki 2026, telefonda görüldü).
      if (board && !board.type && board.kind === 'cuz') board.type = 'quran';
      return board;
    });
  }

  function pickCuz(n) {
    if (busy) return;
    busy = true;
    call('cuz', { series: board.active_series, cuz: n }).then(function (r) {
      busy = false;
      if (r.status === 200 && r.body.ok && r.body.offer && r.body.offer.available) {
        takeBlock(r.body.offer);
        return;
      }
      var reason = (r.body && r.body.offer && r.body.offer.reason) || (r.body && r.body.error);
      if (reason === 'quota' || reason === 'quota_reached') { stageMessage(T.quota); showAppCta(); return; }
      if (reason === 'not_found') { stageMessage(T.gone); showAppCta(); return; }
      if (reason === 'rate_limited') { stageMessage(T.slow); return; }
      // Az önce alınmış: sunucudan taze harita iste, aynı cüzü zorlama.
      stageMessage(T.taken);
      setTimeout(goBoard, 900);
    }).catch(function () { busy = false; stageMessage(T.error, true); });
  }

  function takeBlock(g) {
    if (busy) return;
    busy = true;
    ensureGuestToken();
    call('lease', { series: g.series, start_page: g.start_page, end_page: g.end_page })
      .then(function (r) {
        busy = false;
        if (r.status === 200 && r.body.ok) { offer = g; chosenLen = null; renderConfirm(); return; }
        var m = errText(r.body && r.body.error);
        stageMessage(m[0], m[0] === T.error);
        if (m[1]) setTimeout(goBoard, 900); else showAppCta();
      })
      .catch(function () { busy = false; stageMessage(T.error, true); });
  }

  function onCancel() {
    if (!offer) return;
    var o = offer;
    call('release', { series:o.series, start_page:o.start_page, end_page:o.end_page })
      .catch(function () {}).then(function () { goBoard(); });
  }

  function onConfirm() {
    if (busy || !offer) return;
    busy = true;
    var endPage = offer.start_page + (chosenLen || (offer.end_page - offer.start_page + 1)) - 1;
    call('commit', { series:offer.series, start_page:offer.start_page,
                     end_page:endPage, locale:lang })
      .then(function (r) {
        busy = false;
        if (r.status === 200 && r.body.ok) { renderDone(r.body.claim); loadBoard(); return; }
        var m = errText(r.body && r.body.error);
        stageMessage(m[0], m[0] === T.error);
        if (m[1]) setTimeout(goBoard, 900); else showAppCta();
      })
      .catch(function () { busy = false; stageMessage(T.error, true); });
  }

  /**
   * ARKA PLAN tazelemesi: realtime sinyali ve 20sn yoklama bunu çağırır.
   * Moda saygı duyar; onay ekranındaki kullanıcının önünden bloğu çekmez.
   *
   * ⚠️ KULLANICI İSTEĞİYLE geri dönmek için BUNU KULLANMA, goBoard() kullan.
   * İlk yazımda ikisi aynı fonksiyondu ve "Vazgeç" ile "Başka bölüm al"
   * ÇALIŞMIYORDU: ikisi de refresh() çağırıyordu, refresh() de mod hâlâ
   * 'confirm'/'done' olduğu için erken dönüyordu. Sessizce hiçbir şey olmuyordu.
   */
  function refresh() {
    // 'confirm' ve 'count': kullanıcı bir şeyin ORTASINDA. Yayın gelince
    // ekranı yeniden çizmek onaylamak üzere olduğu bölümü ya da o ana kadar
    // saydığı miktarı siler. Tahtaya döndüğünde zaten taze veri çekiliyor.
    if (mode === 'confirm' || mode === 'count') return Promise.resolve();
    if (mode === 'done') return loadBoard().catch(function () {});
    return loadBoard().then(renderAnyBoard).catch(function (e) {
      // Hata hâlinde başlık yer tutucusu ("…") ekranda KALMASIN.
      if ($('title').textContent === '…') $('title').textContent = 'Manevi Halka';
      stageMessage((e && e.userText) || T.error, !e || !e.userText);
      showAppCta();
    });
  }

  function confirmClaim(unitId) {
    if (busy) return;
    busy = true;
    call('confirm_claim', { unit_id: unitId }).then(function (r) {
      busy = false;
      if (r.status === 200 && r.body.ok) { goBoard(); return; }
      var m = errText(r.body && r.body.error);
      stageMessage(m[0], m[0] === T.error);
    }).catch(function () { busy = false; stageMessage(T.error, true); });
  }

  function dropClaim(unitId) {
    if (busy) return;
    busy = true;
    call('drop_claim', { unit_id: unitId }).then(function (r) {
      busy = false;
      if (r.status === 200 && r.body.ok) { goBoard(); return; }
      var m = errText(r.body && r.body.error);
      stageMessage(m[0], m[0] === T.error);
    }).catch(function () { busy = false; stageMessage(T.error, true); });
  }

  // Tahta tipi jetondan bilinemez; sunucunun döndürdüğü 'kind' karar verir.
  function renderAnyBoard() {
    if (board && board.kind === 'zikir')  return renderZikirBoard();
    if (board && board.kind === 'divide') return renderDivideBoard();
    if (board && board.kind === 'bab')    return renderBabBoard();
    return renderBoard();
  }

  /** KULLANICI isteğiyle seçim ekranına dön. Modu zorlar, bu yüzden çalışır. */
  function goBoard() {
    offer = null;
    chosenLen = null;
    mode = 'board';
    return loadBoard().then(renderAnyBoard).catch(function (e) {
      if ($('title').textContent === '…') $('title').textContent = 'Manevi Halka';
      stageMessage((e && e.userText) || T.error, !e || !e.userText);
      showAppCta();
    });
  }

  // ── Anlık senkron ─────────────────────────────────────────────────────────
  // ⚠️ Gelen mesajın İÇERİĞİ OKUNMAZ. Kanal public; sahte mesaj gönderilebilir
  // (üretimde denenerek kanıtlandı). Sinyal yalnız "şimdi tazele" demektir.
  var rtTimer = null, rtLast = 0;
  var RT_WINDOW = 400;

  /**
   * Yayın sinyali geldi.
   *
   * ⚠️ Düz fren (her sinyalde 350 ms bekle) KULLANILMIYOR: tek bir değişiklikte
   * bile o süreyi ekrana ekliyordu. Bunun yerine ÖNDEN tetikleme —
   * ilk sinyal ANINDA çiziliyor, pencere içindeki ardıllar tek bir kuyruğa
   * düşüyor. Böylece tekil güncelleme gecikmesiz kalıyor ama toplu değişiklikler
   * (havuz açılışı N payı birden 'open' yapar, süresi dolmuş kiralar toplu
   * silinir) yine tek yeniden çekimde birleşiyor.
   */
  function onSignal() {
    if (busy) return;
    var now = Date.now();
    if (now - rtLast >= RT_WINDOW) { rtLast = now; refresh(); return; }
    if (rtTimer) return;                       // pencere için kuyrukta zaten biri var
    rtTimer = setTimeout(function () {
      rtTimer = null; rtLast = Date.now();
      if (!busy) refresh();
    }, RT_WINDOW - (now - rtLast));
  }

  function startRealtime() {
    try {
      if (!window.supabase || !window.supabase.createClient) return;
      window.supabase.createClient(SUPA_URL, SUPA_ANON)
        .channel('event:web:' + webToken)
        .on('broadcast', { event: 'pool_change' }, onSignal)
        .subscribe();
    } catch (e) { /* realtime yoksa polling yeter */ }
  }

  // ── Açılış ────────────────────────────────────────────────────────────────
  stageMessage(T.loading);
  if (!webToken || webToken.length < 16) {
    $('title').textContent = 'Manevi Halka';
    stageMessage(T.notFound, true); showAppCta(); return;
  }

  fetch('/data/quran-page-refs.json')
    .then(function (r) { return r.json(); })
    .then(function (j) { REFS = j.refs; NAMES = j.names; })
    .catch(function () { /* sûre adı gösterilemezse sayfa yine çalışır */ })
    .then(function () { return refresh(); })
    .then(function () {
      startRealtime();
      setInterval(function () { if (!busy) refresh(); }, POLL_MS);
    });
})();
</script>

<script>
(function () {
  var el = document.getElementById("navLoad");
  if (!el) return;
  var root = document.documentElement, tile = el.querySelector(".nl-tile");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var clickAt = 0, target = "", safety = 0;
  function brandOffset() {
    // Basliktaki ikonun ortadaki ikona gore yeri ve olcegi (gorunmuyorsa null).
    var b = document.querySelector("[data-vt-brand]");
    if (!b) return null;
    var r = b.getBoundingClientRect(), tr = tile.getBoundingClientRect();
    if (!(r.bottom > 0 && r.top < innerHeight && r.width)) return null;
    return "translate(" + (r.left + r.width / 2 - (tr.left + tr.width / 2)) + "px," + (r.top + r.height / 2 - (tr.top + tr.height / 2)) + "px) scale(" + (r.width / tr.width) + ")";
  }
  function hide() { clearTimeout(safety); el.classList.remove("on"); root.classList.remove("nl-leaving", "nl-on", "mh-land"); }
  function shown() { return el.classList.contains("on") && performance.now() - clickAt >= 260; }

  // VARIS: onceki sayfa isaretle ayrildiysa bu sayfa ayni katmanla acildi (mh-land); bugu cozulur,
  // ikon basliktaki yerine ucar.
  if (root.classList.contains("mh-land")) {
    var land = function () {
      var to = reduce ? null : brandOffset(), d = reduce ? 0 : 620;
      var done = function () { el.style.transition = "none"; root.classList.remove("mh-land"); void el.offsetWidth; el.style.transition = ""; };
      if (!el.animate || reduce) { done(); return; }
      if (to) tile.animate([{ transform: "none" }, { transform: to }], { duration: d, easing: "cubic-bezier(.45, 0, .2, 1)", fill: "forwards" });
      // Sayfada baslik ikonu yoksa (giris, indirme sayfalari) ikon yerinde hafifce kuculup soner.
      else tile.animate([{ opacity: 1, transform: "none" }, { opacity: 1, offset: .25 }, { opacity: 0, transform: "scale(.9)" }], { duration: d, easing: "ease", fill: "forwards" });
      // Yalniz bugu cozulur; ikon dolu kalip basliga oturur (ikon katmanin icinde oldugu icin
      // butun katmani soldurmak ikonu da ucarken soluklastiriyordu).
      var veil = el.querySelector(".nl-veil");
      veil.animate([{ opacity: 1 }, { opacity: 1, offset: .25 }, { opacity: 0 }], { duration: d, easing: "ease", fill: "forwards" }).onfinish = function () {
        done();
        veil.getAnimations().concat(tile.getAnimations()).forEach(function (a) { a.cancel(); });
      };
    };
    requestAnimationFrame(function () { requestAnimationFrame(land); });
  }

  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
    var u;
    try { u = new URL(a.href, location.href); } catch (_) { return; }
    if (u.origin !== location.origin) return;
    if (u.pathname === location.pathname && u.search === location.search) return;
    // Hepsi SIMDI ve GECIKMESIZ baslar (Safari, yukaridaki not). Ilk 120 ms animasyonlarin icinde
    // gorunmez tutulur, hizli geciste isaret hic belirmez.
    clickAt = performance.now();
    target = u.pathname;
    root.classList.add("nl-leaving", "nl-on");
    el.classList.add("on");
    if (!reduce && tile.animate) {
      var from = brandOffset() || "scale(.82)";
      tile.animate([{ transform: from, offset: 0 }, { transform: from, offset: .2, easing: "cubic-bezier(.3, .7, .2, 1)" }, { transform: "none" }], { duration: 600 });
    }
    clearTimeout(safety);
    safety = setTimeout(hide, 12000);
    // Gezinme iki kare ertelenir: degisiklik ekrana islensin, animasyonlar baslasin (Safari).
    e.preventDefault();
    var gone = false, go = function () { if (!gone) { gone = true; location.assign(u.href); } };
    requestAnimationFrame(function () { requestAnimationFrame(go); });
    setTimeout(go, 80);
  });
  // Ayrilirken: isaret gorunuyorsa gecis atlanir ve yeni sayfaya "isaretle ac" notu birakilir.
  window.addEventListener("pageswap", function (e) { if (shown() && e.viewTransition) e.viewTransition.skipTransition(); });
  window.addEventListener("pagehide", function () {
    if (shown()) { try { sessionStorage.setItem("mh-land", JSON.stringify({ p: target, t: Date.now() })); } catch (_) {} }
  });
  // geri tusuyla onbellekten donulunce isaret kalmasin
  window.addEventListener("pageshow", function (e) { if (e.persisted) hide(); });
})();
</script>
