<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e4d35">
<meta name="robots" content="noindex,nofollow">
<title>Manevi Halka</title>
<link rel="icon" type="image/png" href="/icon.png">
<!-- Metin ve durum mantığı auth/bridge.js'te (5 dil, iki sayfa ortak). -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #f0f9f1 0%, #fefefe 60%);
    color: #1f2937;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: #fff;
    border-radius: 24px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(30, 77, 53, 0.15);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  body.ready .card { opacity: 1; }
  .badge {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge.ok { background: #1e4d35; color: #fff; }
  .badge.warn { background: #f6eddc; color: #8a5a14; }
  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #1e4d35;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
    line-height: 1.25;
  }
  .message {
    font-size: 15px;
    color: #4b5563;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 16px 22px;
    background: #1e4d35;
    color: #fff;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  .btn-primary:active { opacity: 0.85; }
  .desktop {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: #f0f9f1;
    border-radius: 14px;
    color: #1e4d35;
    font-size: 14px;
    line-height: 1.5;
    text-align: start;
  }
  .desktop svg { flex-shrink: 0; width: 28px; height: 28px; }
  .hint {
    margin-top: 28px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #6b7280;
  }
  .store-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @media (min-width: 460px) {
    .store-buttons { flex-direction: row; justify-content: center; }
  }
  .btn-store {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 20px;
    background: #fff;
    color: #1e4d35;
    border: 1.5px solid #cfe3d5;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #9ca3af;
  }
  .footer a {
    color: #1e4d35;
    text-decoration: none;
    font-weight: 500;
  }
</style>
</head>
<body data-flow="reset">

<div class="card">
  <div id="badge" class="badge ok"></div>
  <h1 id="title">Manevi Halka</h1>
  <p id="body" class="message">Open the Manevi Halka app to continue.</p>

  <a id="openApp" class="btn-primary" href="manevisosyal://">Open App</a>
  <div id="desktop" class="desktop"><span id="desktopIcon"></span><span id="desktopText"></span></div>

  <p id="noApp" class="hint">Don’t have the app yet?</p>
  <div class="store-buttons">
    <a href="https://apps.apple.com/app/manevi-halka/id6760654292" class="btn-store" id="iosBtn">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.emrhnayz.spiritualcircle" class="btn-store" id="androidBtn">Google Play</a>
  </div>

  <p class="footer">
    <a href="/">manevihalka.app</a> · <a id="privacyLink" href="/privacy-en.html">Privacy</a> · <a id="contactLink" href="mailto:support@manevihalka.app">Contact</a>
  </p>
</div>

<noscript><style>.card { opacity: 1; }</style></noscript>
<script src="/auth/bridge.js"></script>
</body>
</html>
