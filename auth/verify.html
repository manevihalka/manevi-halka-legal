<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e4d35">
<meta name="robots" content="noindex,nofollow">
<title>Manevi Halka</title>
<link rel="icon" type="image/png" href="/icon.png">
<!-- Metin ve durum mantığı auth/bridge.js'te (5 dil, iki sayfa ortak). -->
<script>
(function () {
  // Tema ILK BOYAMADAN once: sitenin ortak tercihi (mh_theme), yoksa sistem.
  var t = null;
  try { t = localStorage.getItem("mh_theme"); } catch (e) { /* gizli mod */ }
  if (t !== "dark" && t !== "light") {
    try { t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { t = "light"; }
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
  /* 28 Eyl 2026: sitenin yeni gorunumu (ana sayfa, politika, /links, katilma sayfasi ile ayni
     renkler ve yazi tipleri). Yazi tipleri KENDI SUNUCUMUZDAN (SIL OFL).
     ⚠️ verify.html ile reset-password.html'in <style> blogu BIREBIR AYNI; birini degistirirsen oteki de. */
  @font-face { font-family: "Marcellus"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(/fonts/marcellus-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Marcellus"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(/fonts/marcellus-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Onest"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(/fonts/onest-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Onest"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(/fonts/onest-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root { --page:#f7f4ec; --paper:#fffdf8; --ink:#14231c; --body:#4b5a52; --muted:#7a867f; --green:#1e4d35; --pill:#1e4d35;
    --mint:#e8f2ea; --gold:#8a6a22; --gold-soft:#c9a55a; --warn-bg:#f6eddc; --warn:#8a5a14; --line:color-mix(in srgb, #14231c 10%, transparent);
    --display:"Marcellus", "Iowan Old Style", Georgia, serif; --sans:"Onest", -apple-system, "Segoe UI", system-ui, sans-serif; }
  :root[data-theme="dark"] { color-scheme:dark; --page:#0e1a14; --paper:#152720; --ink:#eaf3ee; --body:#b9c8c0; --muted:#8fa298;
    --green:#8fd3ae; --pill:#2f6b4a; --mint:#1d3227; --gold:#d9b563; --gold-soft:#d9b563; --warn-bg:#3a2f1a; --warn:#e7c27a;
    --line:color-mix(in srgb, #eaf3ee 12%, transparent); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--page); color: var(--ink); min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px 16px; overflow-x: clip; -webkit-font-smoothing: antialiased; }
  .card { max-width: 440px; width: 100%; background: var(--paper); border-radius: 28px; padding: 40px 24px 28px; text-align: center;
    border: 1px solid var(--line); box-shadow: 0 30px 60px -36px rgba(10, 30, 20, .45); opacity: 0; transition: opacity .2s ease; }
  body.ready .card { opacity: 1; }
  /* Durum rozeti, sitenin noktali tesbih halkasiyla cevrili */
  .badge { position: relative; width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; }
  .badge::before { content: ""; position: absolute; inset: -11px; border-radius: 50%; border: 3px dotted var(--gold-soft); opacity: .8; }
  .badge.ok { background: var(--pill); color: #fff; }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  h1 { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--ink); margin-bottom: 12px; line-height: 1.15; text-wrap: balance; }
  :root[lang="ar"] h1 { font-family: inherit; font-weight: 700; font-size: 24px; line-height: 1.35; }
  .message { font-size: 15.5px; color: var(--body); line-height: 1.6; margin-bottom: 28px; }
  .btn-primary { display: block; width: 100%; padding: 15px 22px; background: var(--pill); color: #fff; border-radius: 999px;
    font-size: 16px; font-weight: 700; text-decoration: none; }
  .btn-primary:hover, .btn-primary:active { filter: brightness(1.08); }
  .desktop { display: none; align-items: center; gap: 12px; padding: 14px 16px; background: var(--mint); border-radius: 18px;
    color: var(--green); font-size: 14px; line-height: 1.5; text-align: start; }
  .desktop svg { flex-shrink: 0; width: 28px; height: 28px; }
  .hint { margin-top: 28px; margin-bottom: 12px; font-size: 13.5px; color: var(--muted); }
  .store-buttons { display: flex; flex-direction: column; gap: 10px; }
  @media (min-width: 460px) { .store-buttons { flex-direction: row; justify-content: center; } }
  .btn-store { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; background: transparent;
    color: var(--green); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 700; text-decoration: none; }
  .btn-store:hover { background: var(--mint); border-color: transparent; }
  .footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .footer a { color: var(--body); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; border-radius: 6px; }
</style>
</head>
<body data-flow="verify">

<div class="card">
  <div id="badge" class="badge ok"></div>
  <h1 id="title">Manevi Halka</h1>
  <p id="body" class="message">Open the Manevi Halka app to continue.</p>

  <a id="openApp" class="btn-primary" href="manevisosyal://">Open App</a>
  <div id="desktop" class="desktop"><span id="desktopIcon"></span><span id="desktopText"></span></div>

  <p id="noApp" class="hint">Don’t have the app yet?</p>
  <div class="store-buttons">
    <a href="https://apps.apple.com/app/manevi-halka/id6760654292" class="btn-store" id="iosBtn">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.emrhnayz.spiritualcircle" class="btn-store" id="androidBtn">Google Play</a>
  </div>

  <p class="footer">
    <a href="/">manevihalka.app</a> · <a id="privacyLink" href="/privacy-en.html">Privacy</a> · <a id="contactLink" href="mailto:support@manevihalka.app">Contact</a>
  </p>
</div>

<noscript><style>.card { opacity: 1; }</style></noscript>
<script src="/auth/bridge.js"></script>
</body>
</html>
