    return "translate(" + (r.left + r.width / 2 - (tr.left + tr.width / 2)) + "px," + (r.top + r.height / 2 - (tr.top + tr.height / 2)) + "px) scale(" + (r.width / tr.width) + ")";
  }
  function hide() { clearTimeout(safety); el.classList.remove("on"); root.classList.remove("nl-leaving", "nl-on", "mh-land"); }
  function shown() { return el.classList.contains("on") && performance.now() - clickAt >= 260; }

  // VARIS: onceki sayfa isaretle ayrildiysa bu sayfa ayni katmanla acildi (mh-land); bugu cozulur,
  // ikon basliktaki yerine ucar.
  if (root.classList.contains("mh-land")) {
    var land = function () {
      var to = reduce ? null : brandOffset(), d = reduce ? 0 : 620;
      var done = function () { el.style.transition = "none"; root.classList.remove("mh-land"); void el.offsetWidth; el.style.transition = ""; };
      if (!el.animate || reduce) { done(); return; }
      if (to) tile.animate([{ transform: "none" }, { transform: to }], { duration: d, easing: "cubic-bezier(.45, 0, .2, 1)", fill: "forwards" });
      // Sayfada baslik ikonu yoksa (giris, indirme sayfalari) ikon yerinde hafifce kuculup soner.
      else tile.animate([{ opacity: 1, transform: "none" }, { opacity: 1, offset: .25 }, { opacity: 0, transform: "scale(.9)" }], { duration: d, easing: "ease", fill: "forwards" });
      // Yalniz bugu cozulur; ikon dolu kalip basliga oturur (ikon katmanin icinde oldugu icin
      // butun katmani soldurmak ikonu da ucarken soluklastiriyordu).
      var veil = el.querySelector(".nl-veil");
      veil.animate([{ opacity: 1 }, { opacity: 1, offset: .25 }, { opacity: 0 }], { duration: d, easing: "ease", fill: "forwards" }).onfinish = function () {
        done();
        veil.getAnimations().concat(tile.getAnimations()).forEach(function (a) { a.cancel(); });
      };
    };
    requestAnimationFrame(function () { requestAnimationFrame(land); });
  }

  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
    var u;
    try { u = new URL(a.href, location.href); } catch (_) { return; }
    if (u.origin !== location.origin) return;
    if (u.pathname === location.pathname && u.search === location.search) return;
    // Hepsi SIMDI ve GECIKMESIZ baslar (Safari, yukaridaki not). Ilk 120 ms animasyonlarin icinde
    // gorunmez tutulur, hizli geciste isaret hic belirmez.
    clickAt = performance.now();
    target = u.pathname;
    root.classList.add("nl-leaving", "nl-on");
    el.classList.add("on");
    if (!reduce && tile.animate) {
      var from = brandOffset() || "scale(.82)";
      tile.animate([{ transform: from, offset: 0 }, { transform: from, offset: .2, easing: "cubic-bezier(.3, .7, .2, 1)" }, { transform: "none" }], { duration: 600 });
    }
    clearTimeout(safety);
    safety = setTimeout(hide, 12000);
    // Gezinme iki kare ertelenir: degisiklik ekrana islensin, animasyonlar baslasin (Safari).
    e.preventDefault();
    var gone = false, go = function () { if (!gone) { gone = true; location.assign(u.href); } };
    requestAnimationFrame(function () { requestAnimationFrame(go); });
    setTimeout(go, 80);
  });
  // Ayrilirken: isaret gorunuyorsa gecis atlanir ve yeni sayfaya "isaretle ac" notu birakilir.
  window.addEventListener("pageswap", function (e) { if (shown() && e.viewTransition) e.viewTransition.skipTransition(); });
  window.addEventListener("pagehide", function () {
    if (shown()) { try { sessionStorage.setItem("mh-land", JSON.stringify({ p: target, t: Date.now() })); } catch (_) {} }
  });
  // geri tusuyla onbellekten donulunce isaret kalmasin
  window.addEventListener("pageshow", function (e) { if (e.persisted) hide(); });
})();
</script>
