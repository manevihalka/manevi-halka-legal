<!DOCTYPE html>
<!-- Ana sayfanin paylasim gorseli (og-cover-<dil>.jpg, 1200x630) sablonu. ?lang=tr|en|de|fr|ar
     Uretim: python3 _gen/og-home.py (Chrome basliksiz ceker, Pillow JPEG yazar). Metin build-home.mjs h1a/h1b ile ayni.
     Telefonlar giris seridindeki gercek 2.1.0 ekranlari (img/app/<dil>/st-*.webp). _gen yayinlanmaz (Jekyll). -->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Marcellus"; src: url(/fonts/marcellus-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+A720-A7FF; }
  @font-face { font-family: "Marcellus"; src: url(/fonts/marcellus-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+FEFF; }
  @font-face { font-family: "Onest"; font-weight: 400 700; src: url(/fonts/onest-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+A720-A7FF; }
  @font-face { font-family: "Onest"; font-weight: 400 700; src: url(/fonts/onest-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+FEFF; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #f6f1e4; font-family: "Onest", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(110% 130% at 82% 18%, #2c6b4b 0%, #1e4d35 42%, #11301f 100%); }
  [dir="rtl"] body { background: radial-gradient(110% 130% at 18% 18%, #2c6b4b 0%, #1e4d35 42%, #11301f 100%); font-family: "Geeza Pro", "Noto Sans Arabic", system-ui, sans-serif; }
  .ring { position: absolute; width: 900px; height: 900px; left: 560px; top: -170px; opacity: .22; }
  [dir="rtl"] .ring { left: -260px; }
  .glow { position: absolute; left: 520px; top: 140px; width: 760px; height: 420px; transform: rotate(-6deg);
    background: radial-gradient(closest-side, rgba(217, 181, 99, .28), transparent); }
  [dir="rtl"] .glow { left: -80px; transform: rotate(6deg); }
  .copy { position: absolute; top: 92px; left: 80px; width: 548px; }
  [dir="rtl"] .copy { left: auto; right: 80px; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: "Marcellus", serif; font-size: 30px; letter-spacing: .01em; }
  .brand img { width: 58px; height: 58px; border-radius: 15px; box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .6); }
  h1 { margin: 46px 0 0; font-family: "Marcellus", serif; font-weight: 400; font-size: 70px; line-height: 1.05; letter-spacing: -.005em; }
  h1 em { display: block; font-style: normal; color: #e2c374; }
  [dir="rtl"] h1 { font-family: "Geeza Pro", "Noto Naskh Arabic", serif; font-weight: 600; font-size: 66px; line-height: 1.3; }
  .sub { margin-top: 30px; font-size: 25px; font-weight: 500; color: #cfe1d6; }
  .url { position: absolute; bottom: 52px; left: 80px; font-size: 21px; font-weight: 600; color: #9fc3b0; letter-spacing: .02em; }
  [dir="rtl"] .url { left: auto; right: 80px; }
  .ph { position: absolute; width: 238px; padding: 7px; border-radius: 38px; background: #0b1510;
    box-shadow: 0 40px 60px -30px rgba(0, 0, 0, .75), inset 0 0 0 1px rgba(255, 255, 255, .1); transform: rotate(-6deg); }
  [dir="rtl"] .ph { transform: rotate(6deg); }
  .ph img { display: block; width: 100%; height: auto; border-radius: 31px; }
</style>
</head>
<body>
<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="#e2c374" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0 3.1"/><circle cx="50" cy="50" r="36" fill="none" stroke="#e2c374" stroke-width=".35"/></svg>
<div class="glow"></div>
<div id="phones"></div>
<div class="copy" style="overflow:hidden">
  <div class="brand"><img src="/img/brand-icon.webp" alt=""><span>Manevi Halka</span></div>
  <h1><span id="m1"></span> <em id="m2"></em></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="url">manevihalka.app</div>
<script>
  var T = {
    tr: ["Her güzel iş", "bir niyetle başlar.", "Kur'an · Namaz · Zikir · Birlikte hatim"],
    en: ["Every good deed", "begins with an intention.", "Quran · Prayer · Dhikr · Khatm together"],
    de: ["Jede gute Tat", "beginnt mit einer Absicht.", "Koran · Gebet · Dhikr · Gemeinsame Chatma"],
    fr: ["Toute bonne action", "naît d'une intention.", "Coran · Prière · Dhikr · Khatma ensemble"],
    ar: ["كل عمل صالح", "يبدأ بنيّة.", "القرآن · الصلاة · الذكر · ختمة معًا"]
  };
  var L = new URLSearchParams(location.search).get("lang") || "tr", t = T[L] || T.tr, rtl = L === "ar";
  document.documentElement.lang = L; document.documentElement.dir = rtl ? "rtl" : "ltr";
  document.getElementById("m1").textContent = t[0]; document.getElementById("m2").textContent = t[1]; document.getElementById("sub").textContent = t[2];
  // Egik serit: ortada bahce, yanlarinda Kur'an ve kubbe (giris seridiyle ayni egim). Arapcada aynalanir.
  var P = [["st-mushaf", 694, 110], ["st-bahce", 920, 84], ["st-sahne", 1146, 58]], box = document.getElementById("phones");
  P.forEach(function (p) {
    var d = document.createElement("div"); d.className = "ph";
    d.style.left = (rtl ? 1200 - p[1] - 252 : p[1]) + "px"; d.style.top = p[2] + "px";
    d.innerHTML = '<img src="/img/app/' + L + "/" + p[0] + '.webp" alt="">';
    box.appendChild(d);
  });
  // Baslik sutuna sigsin (telefonlara degmesin, en fazla uc satir): gerekirse kuculur
  document.fonts.ready.then(function () {
    var h = document.querySelector("h1"), fs = parseFloat(getComputedStyle(h).fontSize);
    while (fs > 44 && (h.scrollWidth > 548 || h.offsetHeight > fs * 3.3)) { fs -= 2; h.style.fontSize = fs + "px"; }
    document.body.setAttribute("data-ready", "1");
  });
</script>
</body>
</html>
